# Grants `<issuer>#operator` configmap create in marker_ns; pass marker_ns via with.bindings, never a spec.bindings default.
# The Role and RoleBinding are named for the test, since every test shares one namespace.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: StepTemplate
metadata:
  name: marker-writer
spec:
  try:
    - script:
        env:
          - name: MARKER_NS
            value: ($marker_ns)
          - name: NAME
            value: (concat('marker-writer-', $test.metadata.name))
        content: |
          set -eu
          ISSUER=$(helm get values sycophant -n sycophant-system --all -o json | jq -r .idp.issuer)
          kubectl create role "$NAME" -n "$MARKER_NS" --verb=create --resource=configmaps
          kubectl create rolebinding "$NAME" -n "$MARKER_NS" --role="$NAME" --user="${ISSUER}#operator"
  cleanup:
    - script:
        env:
          - name: MARKER_NS
            value: ($marker_ns)
          - name: NAME
            value: (concat('marker-writer-', $test.metadata.name))
        content: |
          kubectl delete rolebinding,role "$NAME" -n "$MARKER_NS" --ignore-not-found
