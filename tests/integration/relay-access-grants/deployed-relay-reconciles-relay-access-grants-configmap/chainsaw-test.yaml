apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deployed-relay-reconciles-relay-access-grants-configmap
spec:
  # The relay's startup blocks on the grants watcher's initial sync, and the
  # pod must schedule and pull before it logs anything. Give the live steps
  # room over the config's 60s exec cap.
  timeouts:
    exec: 150s
    apply: 60s
  description: A deployed relay reconciles the chart's relay-access-grants ConfigMap into a non-empty table.
  steps:
    - name: deployed-relay-syncs-a-relay-access-grants-row-into-a-non-empty-table
      try:
        - script:
            env:
              - name: NS
                value: ($namespace)
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)

              # Render and apply only the relay's own objects. RELAY_NAMESPACE
              # is baked from `-n $NS`, so the pod watches this test's
              # namespace. A workspace provision command renders the relay-toolset-grants
              # the pod mounts.
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n "$NS" \
                --show-only templates/relay-ctrl.yaml \
                --show-only templates/relay-ctrl-rbac.yaml \
                | kubectl apply -n "$NS" -f -
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n "$NS" \
                --set render=workspace --set name=probe \
                --set-json 'command={"toolsets":"stdlib"}' \
                --show-only templates/relay-toolset-grants-cm.yaml \
                | kubectl apply -n "$NS" -f -

              # The operator-written authorization table: exactly one valid
              # row. `app` is a known channel; identity and workspace are
              # non-empty, so `apply_delivery` accepts it and the live table
              # holds one row.
              cat <<'EOF' | kubectl apply -n "$NS" -f -
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: relay-access-grants
                labels:
                  sycophant.md/type: relay-access-grants
              data:
                probe-row: |
                  channel: app
                  identity: PROBECODE12345678
                  workspace: probe
              EOF

              kubectl rollout status deploy/relay-controller -n "$NS" --timeout=120s

              # Poll the relay's log for its own report of a non-empty
              # delivery. The watcher hot-reloads, so the line lands shortly
              # after the ConfigMap is visible.
              deadline=$(( $(date +%s) + 90 ))
              while [ "$(date +%s)" -lt "$deadline" ]; do
                logs=$(kubectl logs deploy/relay-controller -n "$NS" 2>/dev/null || true)
                if printf '%s' "$logs" | grep -q '"message":"grants delivery applied","rows":1'; then
                  echo "relay reconciled relay-access-grants into a one-row table"
                  exit 0
                fi
                sleep 3
              done

              # Red. Distinguish the name-binding failure from an unhealthy
              # pod: if the watch completed its initial sync, the watch was
              # authorized and the pod is up — the empty table is because the
              # compiled watch name and the deployed `relay-access-grants` name
              # disagree.
              logs=$(kubectl logs deploy/relay-controller -n "$NS" 2>/dev/null || true)
              if printf '%s' "$logs" | grep -q '"message":"grants watcher initial sync complete"'; then
                echo "the relay's watch synced but applied no relay-access-grants delivery: the compiled watch name does not equal the deployed relay-access-grants ConfigMap name"
              else
                echo "the relay never completed its initial grants sync"
              fi
              printf '%s\n' "$logs" | grep -i 'grants\|watcher\|rows' >&2 || true
              kubectl get pods -n "$NS" -l app.kubernetes.io/name=relay-controller >&2 || true
              exit 1
