apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: user-command-vap-rejects-unsafe-subject
spec:
  description: >
    The user-command VAP admits an issuer-prefixed subject and refuses one
    carrying a quote, backslash, LF, CR, U+2028, or U+2029, naming the subject
    rule. Server-side dry run: admission runs, nothing persists, and the
    installer never sees a command.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: grant-command-write
      use:
        template: ../../step-templates/command-writer.yaml
        with:
          bindings:
            - name: command_ns
              value: ($tenant_ns)
    - name: assert-vap-admits-safe-and-rejects-unsafe-subject
      try:
        - script:
            timeout: 60s
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -u
              ISSUER=$(helm get values sycophant -n sycophant-system --all -o json | jq -r .idp.issuer)
              OPERATOR="${ISSUER}#operator"
              # Write a user command for subject $1 as the operator, dry run.
              # Prints the apiserver's error, if any.
              probe() {
                hash=$(printf '%s' "$1" | openssl dgst -sha256 | awk '{print $NF}' | cut -c1-10)
                kubectl create configmap "provision-user-$hash" -n "$TENANT_NS" \
                    --from-literal=user="$1" --from-literal=workspaces=alpha \
                    --dry-run=client -o yaml \
                  | kubectl label --local -f - -o yaml \
                      app.kubernetes.io/part-of=sycophant sycophant.md/command=true \
                  | kubectl create --dry-run=server --as="$OPERATOR" -f - 2>&1 >/dev/null
              }
              # The control: a safe subject is admitted, so a rejection
              # below is the character's, not the command's.
              out=$(probe "${ISSUER}#alice") \
                || { echo "the user-command VAP refused a safe subject: $out"; exit 1; }
              reject() {
                if out=$(probe "${ISSUER}#a${2}b"); then
                  echo "the user-command VAP admitted a subject carrying a $1"; exit 1
                fi
                case "$out" in
                  *"no quote, backslash"*) ;;
                  *) echo "a subject carrying a $1 was refused, but not by the subject rule: $out"; exit 1;;
                esac
              }
              LF='
              '
              reject quote '"'
              reject backslash '\'
              reject LF "$LF"
              reject CR "$(printf '\r')"
              reject U+2028 "$(printf '\342\200\250')"
              reject U+2029 "$(printf '\342\200\251')"
              true
