apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: psa-rejects-privileged-tenant-ns-no-workspace-label
spec:
  description: PSA rejects a privileged non-workspace pod in a tenant namespace and the workspace VAP does not fire.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: assert-sycophant-generated-vapbinding
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: (join('-', [$tenant_ns, 'sycophant-pod-binding']))
    - name: apply-privileged-pod-no-workspace-label
      try:
        - apply:
            file: ../../fixtures/privileged-pod.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'violates PodSecurity "restricted')): true
                  (contains($error, 'cluster-gvisor-pod-policy')): false
      catch:
        - events:
            namespace: ($tenant_ns)
