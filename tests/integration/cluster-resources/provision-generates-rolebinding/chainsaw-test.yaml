apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: provision-generates-rolebinding
spec:
  description: |
    The tenant-rolebinding-generator GeneratingPolicy generates the relay
    tokenreview ClusterRoleBinding, the pod VAP binding, and the per-namespace
    tenant-deployer RoleBinding binding the tenant-deployer SA to the
    tenant-operator ClusterRole.

    A CEL policy has no named rules, so the generated set is asserted by the
    kinds the template emits rather than by rule name.
  steps:
    - name: assert-deployer-rolebinding-generated
      try:
        - script:
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-cluster" \
                -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1) || {
                echo "chart must render with no policyEngine set; helm error:" >&2
                printf '%s\n' "$out" >&2
                exit 1
              }

              gen=$(printf '%s' "$out" | awk 'BEGIN{RS="\n---\n"} \
                /kind: GeneratingPolicy/ && /name: tenant-rolebinding-generator/ {print}')
              [ -n "$gen" ] \
                || { echo "tenant-rolebinding-generator GeneratingPolicy missing"; exit 1; }

              printf '%s' "$gen" | grep -q 'kind: RoleBinding' \
                || { echo "the deployer RoleBinding must be generated"; printf '%s\n' "$gen" >&2; exit 1; }
              printf '%s' "$gen" | grep -q 'name: tenant-operator' \
                || { echo "the deployer RoleBinding must bind the tenant-operator ClusterRole"; printf '%s\n' "$gen" >&2; exit 1; }

              printf '%s' "$gen" | grep -q 'kind: ClusterRoleBinding' \
                || { echo "relay tokenreview ClusterRoleBinding must remain"; printf '%s\n' "$gen" >&2; exit 1; }
              printf '%s' "$gen" | grep -q 'cluster-relay-tokenreview' \
                || { echo "the generated binding must name the relay tokenreview ClusterRole"; printf '%s\n' "$gen" >&2; exit 1; }
              printf '%s' "$gen" | grep -q 'kind: ValidatingAdmissionPolicyBinding' \
                || { echo "pod VAP binding must remain"; printf '%s\n' "$gen" >&2; exit 1; }
              true
