apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: delete-deletingpolicy-reaps-namespace
spec:
  description: |
    Delete is a DeletingPolicy that reaps the tenant Namespace when the
    keepalive TTL elapses. It is a separate object from the suspend mutate (no
    sequencing controller), and there is no PV-Retain step.
  steps:
    - name: assert-delete-deletingpolicy
      try:
        - script:
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-cluster" \
                -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1) || {
                echo "chart must render with no policyEngine set; helm error:" >&2
                printf '%s\n' "$out" >&2
                exit 1
              }

              dp=$(printf '%s' "$out" | awk 'BEGIN{RS="\n---\n"} \
                /kind: DeletingPolicy/ {print}')
              [ -n "$dp" ] \
                || { echo "no DeletingPolicy reaping the tenant namespace"; exit 1; }

              printf '%s' "$dp" | grep -q 'namespaces' \
                || { echo "DeletingPolicy must target the tenant Namespace"; printf '%s\n' "$dp" >&2; exit 1; }
              printf '%s' "$dp" | grep -q 'schedule:' \
                || { echo "reap runs on a schedule, not on admission"; printf '%s\n' "$dp" >&2; exit 1; }
              printf '%s' "$dp" | grep -q 'reap-after' \
                || { echo "reap must key on the TTL the suspend reactor stamps"; printf '%s\n' "$dp" >&2; exit 1; }
              printf '%s' "$dp" | grep -qi 'Retain' \
                && { echo "namespace reap cascades to PVCs; no PV-Retain step"; printf '%s\n' "$dp" >&2; exit 1; }
              true
