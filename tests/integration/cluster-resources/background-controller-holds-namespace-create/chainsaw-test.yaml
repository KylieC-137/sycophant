apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: background-controller-holds-namespace-create
spec:
  description: The Kyverno background-controller role grants create on Namespaces, ResourceQuotas, and LimitRanges.
  steps:
    - name: assert-aggregated-create-verbs
      try:
        - script:
            content: |
              set -euo pipefail
              out=$(helm template probe "$(git rev-parse --show-toplevel)/charts/sycophant-cluster" -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1) || { printf '%s\n' "$out" >&2; exit 1; }

              role=$(printf '%s' "$out" | awk 'BEGIN{RS="\n---\n"} \
                /rbac.kyverno.io\/aggregate-to-background-controller/ {print}')
              [ -n "$role" ] \
                || { echo "aggregate-to-background-controller ClusterRole missing"; exit 1; }

              printf '%s' "$role" | grep -q 'resourcequotas' \
                || { echo "aggregated bg-controller role must grant resourcequotas create"; printf '%s\n' "$role" >&2; exit 1; }
              printf '%s' "$role" | grep -q 'limitranges' \
                || { echo "aggregated bg-controller role must grant limitranges create"; printf '%s\n' "$role" >&2; exit 1; }

              printf '%s' "$role" | awk '
                /resources:/ { ns = ($0 ~ /namespaces/) }
                ns && /verbs:/ { if ($0 ~ /create/) found = 1; ns = 0 }
                END { exit(found ? 0 : 1) }' \
                || { echo "aggregated bg-controller role must grant create on namespaces"; printf '%s\n' "$role" >&2; exit 1; }
              true
