apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: background-controller-holds-namespace-create
spec:
  description: |
    The Kyverno background-controller aggregated ClusterRole grants create on
    Namespaces and ResourceQuotas so the reactor can generate them under its own
    ServiceAccount rights.
  steps:
    - name: assert-aggregated-create-verbs
      try:
        - script:
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-cluster" \
                -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1) || {
                echo "chart must render with no policyEngine set; helm error:" >&2
                printf '%s\n' "$out" >&2
                exit 1
              }

              role=$(printf '%s' "$out" | awk 'BEGIN{RS="\n---\n"} \
                /rbac.kyverno.io\/aggregate-to-background-controller/ {print}')
              [ -n "$role" ] \
                || { echo "aggregate-to-background-controller ClusterRole missing"; exit 1; }

              printf '%s' "$role" | grep -q 'resourcequotas' \
                || { echo "aggregated bg-controller role must grant resourcequotas create"; printf '%s\n' "$role" >&2; exit 1; }

              printf '%s' "$role" | awk '
                /resources:/ { ns = ($0 ~ /namespaces/) }
                ns && /verbs:/ { if ($0 ~ /create/) found = 1; ns = 0 }
                END { exit(found ? 0 : 1) }' \
                || { echo "aggregated bg-controller role must grant create on namespaces"; printf '%s\n' "$role" >&2; exit 1; }
              true
