apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: suspend-command-scales-to-zero
spec:
  description: A suspend command in a tenant namespace scales that namespace's Deployments to zero.
  steps:
    - name: assert-suspend-mutate
      try:
        - script:
            content: |
              out=$(helm template probe "$(git rev-parse --show-toplevel)/charts/sycophant-cluster" -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1) || { printf '%s\n' "$out" >&2; exit 1; }

              mut=$(printf '%s' "$out" | awk 'BEGIN{RS="\n---\n"} \
                /kind: MutatingPolicy/ && /replicas/ && /deployments/ {print}')
              [ -n "$mut" ] \
                || { echo "no suspend MutatingPolicy scaling Deployments"; exit 1; }

              printf '%s' "$mut" | grep -Eq 'replicas:[[:space:]]*"?0"?' \
                || { echo "suspend must scale tenant Deployments to zero replicas"; printf '%s\n' "$mut" >&2; exit 1; }

              printf '%s' "$mut" | grep -q 'mutateExisting' \
                || { echo "suspend acts on Deployments that already exist"; printf '%s\n' "$mut" >&2; exit 1; }

              printf '%s' "$mut" | grep -qF 'object.metadata.namespace' \
                || { echo "suspend targets must be scoped to the suspend command's own namespace"; printf '%s\n' "$mut" >&2; exit 1; }
              true
