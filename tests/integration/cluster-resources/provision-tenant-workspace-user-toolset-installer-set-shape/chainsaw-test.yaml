apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: provision-tenant-workspace-user-toolset-installer-set-shape
spec:
  description: Each provision-<kind> installer pair emits an SA, Job, and RoleBinding sharing one provision-<kind>-<handle> name, reap-after, the component label, and a provision-write roleRef.
  steps:
    - name: assert-installer-set
      try:
        - script:
            content: |
              out=$(helm template probe "$(git rev-parse --show-toplevel)/charts/sycophant-cluster" -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1) || { printf '%s\n' "$out" >&2; exit 1; }

              for kind in tenant workspace user toolset; do
                set=$(printf '%s' "$out" | awk -v k="$kind" 'BEGIN{RS="\n---\n"} \
                  /kind: GeneratingPolicy/ && $0 ~ ("name: provision-" k "(-stack|-grant)?\n") {print "---"; print}')
                [ "$(printf '%s' "$set" | grep -c 'kind: GeneratingPolicy')" -eq 2 ] \
                  || { echo "[$kind] expected the provision-$kind installer and binding GeneratingPolicies"; printf '%s\n' "$set" >&2; exit 1; }

                printf '%s' "$set" | grep -q 'kind: ServiceAccount' \
                  || { echo "[$kind] installer set must emit a ServiceAccount"; printf '%s\n' "$set" >&2; exit 1; }
                printf '%s' "$set" | grep -q 'kind: Job' \
                  || { echo "[$kind] installer set must emit a Job"; printf '%s\n' "$set" >&2; exit 1; }
                printf '%s' "$set" | grep -q 'kind: RoleBinding' \
                  || { echo "[$kind] installer set must emit a RoleBinding"; printf '%s\n' "$set" >&2; exit 1; }

                [ "$(printf '%s' "$set" | grep -c "\"provision-${kind}-\" + variables.handle")" -ge 3 ] \
                  || { echo "[$kind] SA, Job, and RoleBinding must share the provision-$kind-<handle> composed name"; printf '%s\n' "$set" >&2; exit 1; }

                printf '%s' "$set" | grep -q 'sycophant.md/reap-after' \
                  || { echo "[$kind] installer set must stamp the reap-after annotation"; printf '%s\n' "$set" >&2; exit 1; }

                printf '%s' "$set" | grep -q "app.kubernetes.io/component: provision-${kind}" \
                  || { echo "[$kind] installer objects must carry component=provision-$kind"; printf '%s\n' "$set" >&2; exit 1; }

                printf '%s' "$set" | grep -q 'kind: ClusterRole' \
                  || { echo "[$kind] RoleBinding roleRef must bind a ClusterRole"; printf '%s\n' "$set" >&2; exit 1; }
                printf '%s' "$set" | grep -q 'name: provision-write' \
                  || { echo "[$kind] RoleBinding roleRef must be ClusterRole provision-write"; printf '%s\n' "$set" >&2; exit 1; }
              done
              true
