apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: provision-generates-namespace-and-quota
spec:
  description: The provision reactor generates only the tenant Namespace, a ResourceQuota sized from the provision command's capacity, and a LimitRange.
  steps:
    - name: assert-provision-generate-set
      try:
        - script:
            content: |
              out=$(helm template probe "$(git rev-parse --show-toplevel)/charts/sycophant-cluster" -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1) || { printf '%s\n' "$out" >&2; exit 1; }

              cpol=$(printf '%s' "$out" | awk 'BEGIN{RS="\n---\n"} \
                /kind: GeneratingPolicy/ && /configmaps/ && /kind: ResourceQuota/ {print}')
              [ -n "$cpol" ] \
                || { echo "no provision GeneratingPolicy generating a ResourceQuota from a configmap provision command"; exit 1; }

              printf '%s' "$cpol" | grep -q 'kind: Namespace' \
                || { echo "provision generate must produce the tenant Namespace"; printf '%s\n' "$cpol" >&2; exit 1; }
              printf '%s' "$cpol" | grep -q 'kind: ResourceQuota' \
                || { echo "provision generate must produce a ResourceQuota"; printf '%s\n' "$cpol" >&2; exit 1; }
              printf '%s' "$cpol" | grep -q 'capacity' \
                || { echo "ResourceQuota must be sized from the provision command capacity field"; printf '%s\n' "$cpol" >&2; exit 1; }
              printf '%s' "$cpol" | grep -q 'kind: LimitRange' \
                || { echo "provision generate must produce a LimitRange defaulting container memory"; printf '%s\n' "$cpol" >&2; exit 1; }

              printf '%s' "$cpol" | grep -q 'kind: RoleBinding' \
                && { echo "provision generate must produce no RoleBinding"; printf '%s\n' "$cpol" >&2; exit 1; }
              printf '%s' "$cpol" | grep -qi 'authority' \
                && { echo "a provision command carries no authority field; selection is identity, not a command field"; printf '%s\n' "$cpol" >&2; exit 1; }
              true
