apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: provision-generates-namespace-and-quota
spec:
  description: |
    The provision GeneratingPolicy fires on a labelled ConfigMap marker in
    sycophant-system, gates the reserved name in its own match constraints, and
    generates the tenant Namespace plus a ResourceQuota sized from the marker's
    capacity and nothing else.
  steps:
    - name: assert-provision-generate-set
      try:
        - script:
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-cluster" \
                -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1) || {
                echo "chart must render with no policyEngine set; helm error:" >&2
                printf '%s\n' "$out" >&2
                exit 1
              }

              cpol=$(printf '%s' "$out" | awk 'BEGIN{RS="\n---\n"} \
                /kind: GeneratingPolicy/ && /configmaps/ && /kind: ResourceQuota/ {print}')
              [ -n "$cpol" ] \
                || { echo "no provision GeneratingPolicy generating a ResourceQuota from a configmap marker"; exit 1; }

              printf '%s' "$cpol" | grep -q 'kind: Namespace' \
                || { echo "provision generate must produce the tenant Namespace"; printf '%s\n' "$cpol" >&2; exit 1; }
              printf '%s' "$cpol" | grep -q 'kind: ResourceQuota' \
                || { echo "provision generate must produce a ResourceQuota"; printf '%s\n' "$cpol" >&2; exit 1; }
              printf '%s' "$cpol" | grep -q 'capacity' \
                || { echo "ResourceQuota must be sized from the marker capacity field"; printf '%s\n' "$cpol" >&2; exit 1; }

              printf '%s' "$cpol" | grep -q 'kind: RoleBinding' \
                && { echo "provision generate must produce no RoleBinding"; printf '%s\n' "$cpol" >&2; exit 1; }
              printf '%s' "$cpol" | grep -qi 'authority' \
                && { echo "marker carries no authority field; selection is identity, not a marker field"; printf '%s\n' "$cpol" >&2; exit 1; }
              true
