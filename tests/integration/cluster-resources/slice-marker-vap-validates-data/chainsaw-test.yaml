apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: slice-marker-vap-validates-data
spec:
  description: The workspace, toolset, and user marker VAPs deny a name one over its helm release cap and a user subject with a quote, CR, or U+2028, and admit a name exactly at the cap.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: grant-marker-write
      use:
        template: ../../step-templates/marker-writer.yaml
        with:
          bindings:
            - name: marker_ns
              value: ($tenant_ns)
    - name: validate-data
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -u
              ISSUER=$(helm get values sycophant -n sycophant-system --all -o json | jq -r .idp.issuer)
              # marker <kind> <data lines>
              marker() {
                cat <<MANIFEST | kubectl create --dry-run=server --as="${ISSUER}#operator" -f - 2>&1
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: provision-$1
                namespace: ${TENANT_NS}
                labels:
                  app.kubernetes.io/part-of: sycophant
                  sycophant.md/lifecycle-marker: "true"
              data:
                handle: 0f1e2d3c4b
              $2
              MANIFEST
              }
              name() { printf 'a%.0s' $(seq 1 "$1"); }
              deny() {
                if out=$(marker "$1" "$2"); then echo "admitted $1: $2"; exit 1; fi
                case "$out" in *"marker-provision-$1"*) ;; *) echo "$out"; exit 1;; esac
              }
              admit() { marker "$1" "$2" || exit 1; }
              deny workspace "  workspace: $(name 44)
                values: \"{}\""
              admit workspace "  workspace: $(name 43)
                values: \"{}\""
              deny toolset "  toolset: $(name 46)
                values: \"{}\""
              admit toolset "  toolset: $(name 45)
                values: \"{}\""
              deny user "  user: '${ISSUER}#a\"b'"
              # YAML double-quoted escapes, so the subject carries the raw CR and U+2028.
              deny user '  user: "'"${ISSUER}"'#a\rb"'
              deny user '  user: "'"${ISSUER}"'#a\u2028b"'
              admit user "  user: '${ISSUER}#alice'"
