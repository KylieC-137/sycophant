apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster-chart-requires-kyverno-crds
spec:
  description: |
    With no external branch, rendering the cluster chart when the Kyverno CRDs
    are absent hard-fails and names the missing CRD. There is no way to skip the
    Kyverno policies.
  steps:
    - name: assert-missing-crds-fail-render
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              err=$(helm template probe "$REPO_ROOT/charts/sycophant-cluster" \
                -n sycophant-system 2>&1)
               && rc=0 || rc=$?
              [ "$rc" -ne 0 ] \
                || { echo "missing Kyverno CRDs must fail render, got rc=0"; printf '%s\n' "$err" >&2; exit 1; }
              printf '%s' "$err" | grep -q 'policies.kyverno.io/v1/ValidatingPolicy' \
                || { echo "render failure must name the missing Kyverno CRD"; printf '%s\n' "$err" >&2; exit 1; }
              true
