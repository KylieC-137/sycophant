apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster-chart-always-renders-kyverno
spec:
  description: |
    The cluster chart renders with no policyEngine value set and always emits
    the Kyverno policies when the CRDs are present. No kyverno.enabled toggle
    exists.
  steps:
    - name: assert-renders-without-policy-engine
      try:
        - script:
            content: |
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-cluster" \
                -n sycophant-system \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy 2>&1)
              rc=$?
              [ "$rc" -eq 0 ] \
                || { echo "chart must render with no policyEngine set; got rc=$rc"; printf '%s\n' "$out" >&2; exit 1; }

              printf '%s' "$out" | grep -q 'name: tenant-rolebinding-generator' \
                || { echo "cluster chart must always render the Kyverno policies"; exit 1; }
              true
