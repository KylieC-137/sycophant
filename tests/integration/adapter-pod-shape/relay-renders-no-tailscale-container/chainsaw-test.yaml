apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: relay-renders-no-tailscale-container
spec:
  description: The rendered relay pod has no tailscale or tsnet container for any values combination.
  steps:
    - name: assert-no-tailscale-container-with-a-channel-configured
      try:
        - script:
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --set-string channels.app.kind=app \
                --set-string channels.app.loginServer=https://hs.example.test \
                --show-only templates/relay-ctrl.yaml 2>&1) \
                || { echo "relay-ctrl.yaml must render with a channel configured"; printf '%s\n' "$out" >&2; exit 1; }

              containers=$(printf '%s' "$out" | kubectl apply --dry-run=client -f - \
                -o jsonpath='{range .items[?(@.kind=="Deployment")]}{range .spec.template.spec.containers[*]}{.name}={.image}{"\n"}{end}{end}' 2>&1)
              printf '%s' "$containers" | grep -qi 'tailscale\|tsnet' \
                && { echo "the relay pod still carries a tailscale/tsnet container"; printf '%s\n' "$containers" >&2; exit 1; }

              printf '%s' "$out" | grep -q 'relay-tsnet-bridge-serve' \
                && { echo "the tsnet serve ConfigMap still renders alongside the relay"; exit 1; }
              printf '%s' "$out" | grep -q 'TS_USERSPACE\|TS_AUTHKEY\|TS_SERVE_CONFIG' \
                && { echo "tsnet environment still renders in the relay pod"; printf '%s\n' "$out" | grep -n 'TS_' >&2; exit 1; }
              true
    - name: assert-no-tailscale-container-with-no-channels
      try:
        - script:
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --show-only templates/relay-ctrl.yaml 2>&1) \
                || { echo "relay-ctrl.yaml must render with default (empty) channels"; printf '%s\n' "$out" >&2; exit 1; }
              printf '%s' "$out" | grep -qi 'tailscale\|tsnet' \
                && { echo "the relay pod carries tsnet content under default values"; printf '%s\n' "$out" | grep -ni 'tailscale\|tsnet' >&2; exit 1; }
              true
    - name: assert-the-relay-sa-holds-no-secret-update-or-patch
      try:
        - script:
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --set-string channels.app.kind=app \
                --set-string channels.app.loginServer=https://hs.example.test 2>&1) \
                || { echo "tenant chart must render with a channel configured"; printf '%s\n' "$out" >&2; exit 1; }

              # Every RoleBinding subject that is bound to a Role granting write
              # verbs on Secrets. The relay-controller SA must appear in none of them.
              bindings=$(printf '%s' "$out" | kubectl apply --dry-run=client -f - \
                -o jsonpath='{range .items[?(@.kind=="RoleBinding")]}{.metadata.name}|{.roleRef.name}|{range .subjects[*]}{.name},{end}{"\n"}{end}' 2>&1)

              printf '%s\n' "$bindings" | grep '^relay-tsnet-bridge|' | grep -q 'relay-controller,' \
                && { echo "the tsnet state-Secret Role is still bound to the relay SA; the relay would keep update+patch on Secrets"; printf '%s\n' "$bindings" >&2; exit 1; }
              true
