apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: foreign-pvc-mount-denies
spec:
  description: |
    A capability-job may mount its own workspace's data PVC and no other claim.
    The gate derives the approved name from the unforgeable creating identity as
    `ws-<workspace>-data`, so a Job created under `ws-probe` that
    names any other claim is denied.

    Three cases under one identity, because a deny-only suite passes for a rule
    that denies everything:
      - `ws-other-data`   -- a sibling workspace's files. Denied.
      - `ws-probe-conversation` -- this workspace's own conversation
        history, which the harness owns and tool jobs must never mount; a tool
        job with it mounted RW could forge the conversation log. Denied.
      - `ws-probe-data` -- the mount every tool job makes. Admitted.

    Live-cluster test, justified on two counts the offline suite
    (`tests/unit/kyverno-policies/capability-job-gate-as-harness`) cannot cover:
    the approved name is derived from the authenticated creator, which only a
    real impersonated create produces; and the offline CLI emits no result row
    for a deleted rule, so only an apiserver effect reds when the rule is
    removed rather than weakened.

    Mutation guard: deleting the rule, or relaxing the claim-name comparison to
    a `probe-` prefix match, admits the conversation-history Job. Denying
    unconditionally reds the admit case.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    # The allowlist is empty because no case here names a Secret, but it must
    # exist: Kyverno fails closed on a missing context source and would deny
    # every Job below, including the admit case.
    - name: seed-capability-grants
      use:
        template: ../../step-templates/capability-grants.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: grants
              value: {}
    - name: sibling-workspace-pvc-denies
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:ws-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: sibling-workspace-pvc
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: ws-probe-unprivileged
                    volumes:
                      - name: workspace
                        persistentVolumeClaim:
                          claimName: ws-other-data
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
                        volumeMounts:
                          - name: workspace
                            mountPath: /workspace
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
    - name: conversation-history-pvc-denies
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:ws-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: conversation-history-pvc
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: ws-probe-unprivileged
                    volumes:
                      - name: history
                        persistentVolumeClaim:
                          claimName: ws-probe-conversation
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
                        volumeMounts:
                          - name: history
                            mountPath: /var/lib/harness
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-capability-job-gate')): true
      catch:
        - events:
            namespace: ($tenant_ns)
    - name: own-workspace-pvc-admits
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              cat <<MANIFEST | kubectl create --as="system:serviceaccount:${TENANT_NS}:ws-probe" -n "$TENANT_NS" -f -
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: own-workspace-pvc
              spec:
                template:
                  metadata:
                    labels:
                      sycophant.md/job-kind: tool
                  spec:
                    restartPolicy: Never
                    serviceAccountName: ws-probe-unprivileged
                    volumes:
                      - name: workspace
                        persistentVolumeClaim:
                          claimName: ws-probe-data
                    containers:
                      - name: probe
                        image: registry.k8s.io/pause:3.9
                        volumeMounts:
                          - name: workspace
                            mountPath: /workspace
              MANIFEST
            check:
              ($error == null): true
      catch:
        - events:
            namespace: ($tenant_ns)
