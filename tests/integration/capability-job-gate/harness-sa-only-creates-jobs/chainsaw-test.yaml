apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-sa-only-creates-jobs
spec:
  description: harness-<ws> may create Jobs and list and watch ConfigMaps, and nothing else.
  steps:
    - name: render-and-assert-harness-role
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              tmp=$(mktemp)
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns \
                --set render=workspace --set name=probe \
                --set-json 'command={"toolsets":"tool","grant.tool.reader.secret":"approved-secret"}' \
                > "$tmp"
              python3 - "$tmp" <<'PY'
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if d]

              sas = [d for d in docs if d.get("kind") == "ServiceAccount"
                     and d["metadata"]["name"] == "harness-probe"]
              assert sas, "ServiceAccount harness-probe was not rendered"

              # Find the Role(s) bound to harness-probe.
              roles = {d["metadata"]["name"]: d for d in docs if d.get("kind") == "Role"}
              bound = []
              for rb in [d for d in docs if d.get("kind") == "RoleBinding"]:
                  names = {s.get("name") for s in (rb.get("subjects") or [])
                           if s.get("kind") == "ServiceAccount"}
                  if "harness-probe" in names:
                      ref = rb.get("roleRef") or {}
                      assert ref.get("kind") == "Role", \
                          f"harness-probe must bind a namespaced Role, got {ref.get('kind')!r}"
                      bound.append(ref["name"])
              assert bound, "no RoleBinding grants harness-probe any Role"
              assert len(bound) == 1, \
                  f"harness-probe must bind exactly one Role, got {bound}"

              rules = roles[bound[0]].get("rules") or []
              got = sorted(
                  (tuple(sorted(r.get("apiGroups") or [])),
                   tuple(sorted(r.get("resources") or [])),
                   tuple(sorted(r.get("verbs") or [])))
                  for r in rules)
              want = sorted([
                  (("batch",), ("jobs",), ("create",)),
                  (("",), ("configmaps",), ("list", "watch")),
              ])
              assert got == want, f"harness-probe Role must be exactly {want}, got {got}"
              print("OK")
              PY
