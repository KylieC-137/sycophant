apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workspace-sa-no-verbs
spec:
  description: The ws-<ws>-init ServiceAccount can perform no API verb.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: ws_sa
      value: ws-chainsaw-init
  steps:
    - name: setup-tenant-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create namespace "$TENANT_NS"
    - name: setup-workspace-sa
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: ($ws_sa)
                namespace: ($tenant_ns)
    - name: positive-control-impersonation-works
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl auth whoami -o jsonpath='{.status.userInfo.username}' \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error == null): true
              (contains($stdout, 'ws-chainsaw-init')): true
    - name: cannot-get-secrets-in-tenant-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl get secrets -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-list-secrets-cluster-wide
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl get secrets -A \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-get-secrets-in-system-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl get secrets -n sycophant-system \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-list-pods-in-tenant-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl get pods -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-list-pods-cluster-wide
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl get pods -A \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-read-pod-logs
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl get --raw="/api/v1/namespaces/${TENANT_NS}/pods/x/log" \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-exec-into-pods
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl exec -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}" \
                any-pod -- echo hi
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-attach-ephemeral-container
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl patch pod x -n "$TENANT_NS" \
                --subresource=ephemeralcontainers --type=strategic \
                -p='{"spec":{"ephemeralContainers":[]}}' \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-create-pods
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl run probe -n "$TENANT_NS" \
                --image=registry.k8s.io/pause:3.9 \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-create-jobs
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl create job probe -n "$TENANT_NS" \
                --image=registry.k8s.io/pause:3.9 \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-create-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: WS_SA
                value: ($ws_sa)
            content: |
              set -euo pipefail
              kubectl create secret generic probe \
                --from-literal=k=v -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:${WS_SA}"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
