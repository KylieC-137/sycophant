apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-deployer-no-cluster-writes
spec:
  description: |
    The tenant-deployer ClusterRole grants no namespaced resource writes
    cluster-wide. Its per-tenant write access is scoped to a single tenant ns
    by the generated tenant-deployer RoleBinding (see
    cluster-resources/provision-generates-rolebinding); it never leaks to
    default, kube-system, or any un-bound namespace.

    Real API calls — REAL `kubectl create deployment` impersonating the deployer
    in default + kube-system (expect Forbidden in both). The paired read proves
    the identity resolves and the denials are the ClusterRole's bounds, not a
    broken impersonation.
  steps:
    - name: cannot-create-deployment-in-default
      try:
        - script:
            content: |
              kubectl create deployment chainsaw-probe \
                --image=registry.k8s.io/pause:3.9 -n default \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-create-deployment-in-kube-system
      try:
        - script:
            content: |
              kubectl create deployment chainsaw-probe \
                --image=registry.k8s.io/pause:3.9 -n kube-system \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: probe-deployer-resolves-as-an-identity
      try:
        - script:
            content: |
              kubectl get pods -n default \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error == null): true
