apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: relay-ctrl-identity-rbac
spec:
  description: The chart-rendered relay-controller Role is read-only on ConfigMaps and spawns no workload.
  steps:
    - name: assert-configmaps-are-read-only-for-the-relay
      try:
        - script:
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)
              out=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns 2>&1) \
                || { echo "tenant chart must render offline"; printf '%s\n' "$out" >&2; exit 1; }

              rules=$(printf '%s' "$out" | kubectl apply --dry-run=client -f - \
                -o jsonpath='{range .items[?(@.metadata.name=="relay-controller")]}{range .rules[*]}{.apiGroups}~{.resources}~{.verbs}~{.resourceNames}{"\n"}{end}{end}' 2>&1) \
                || { echo "render did not parse"; printf '%s\n' "$rules" >&2; exit 1; }
              [ -n "$rules" ] || { echo "no relay-controller Role rendered"; exit 1; }

              cm=$(printf '%s\n' "$rules" | grep '"configmaps"' || true)
              [ -n "$cm" ] \
                || { echo "the relay Role grants nothing on ConfigMaps; it cannot watch the identity table"; printf '%s\n' "$rules" >&2; exit 1; }
              for verb in get list watch; do
                printf '%s' "$cm" | grep -q "\"$verb\"" \
                  || { echo "the relay Role must grant '$verb' on ConfigMaps"; printf '%s\n' "$cm" >&2; exit 1; }
              done
              for verb in create update patch delete deletecollection; do
                printf '%s' "$cm" | grep -q "\"$verb\"" \
                  && { echo "the relay Role grants '$verb' on ConfigMaps; RBAC is the first lock on the identity table and it must be read-only"; printf '%s\n' "$cm" >&2; exit 1; }
              done

              true
    - name: assert-the-relay-can-create-no-workload
      try:
        - script:
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)
              base=$(helm template probe "$REPO_ROOT/charts/sycophant-tenant" -n probe-ns 2>&1) \
                || { echo "tenant chart must render offline"; printf '%s\n' "$base" >&2; exit 1; }
              channel=$(helm template channel "$REPO_ROOT/charts/sycophant-channel" -n probe-ns \
                --set-string name=app --set-string command.kind=app \
                --set-string command.loginServer=https://hs.example.test 2>&1) \
                || { echo "channel chart must render with an app channel"; printf '%s\n' "$channel" >&2; exit 1; }
              out=$(printf '%s\n---\n%s\n' "$base" "$channel")

              # Every rule of every Role bound to relay-controller: no spawn powers.
              roles=$(printf '%s' "$out" | kubectl apply --dry-run=client -f - \
                -o jsonpath='{range .items[?(@.kind=="RoleBinding")]}{.roleRef.name}|{range .subjects[*]}{.name},{end}{"\n"}{end}' \
                | grep 'relay-controller,' | cut -d'|' -f1)
              [ -n "$roles" ] || { echo "no Role is bound to the relay-controller SA"; exit 1; }

              for role in $roles; do
                rules=$(printf '%s' "$out" | kubectl apply --dry-run=client -f - \
                  -o jsonpath="{range .items[?(@.metadata.name==\"${role}\")]}{range .rules[*]}{.resources}~{.verbs}{\"\\n\"}{end}{end}")
                for res in pods jobs deployments replicaset statefulsets daemonsets; do
                  printf '%s\n' "$rules" | grep -q "\"$res\"" \
                    && { echo "Role '$role' bound to relay-controller grants verbs on '$res'; nothing spawns adapters at runtime"; printf '%s\n' "$rules" >&2; exit 1; }
                done
              done
              true
