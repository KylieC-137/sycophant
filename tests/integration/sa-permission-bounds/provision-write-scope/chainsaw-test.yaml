apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: provision-write-scope
spec:
  description: A provision-write binding is write-only on Secrets except two pinned names, and grants writes in its own namespace only.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: bind-provision-probe
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: provision-probe
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: provision-probe
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: provision-probe
                  namespace: ($tenant_ns)
              roleRef:
                kind: ClusterRole
                name: provision-write
                apiGroup: rbac.authorization.k8s.io
    - name: provision-write-is-write-only-on-secrets
      try:
        - script:
            content: |
              set -e
              kubectl get clusterrole provision-write -o json | python3 -c '
              import json, sys
              reads = {"get", "list", "watch"}
              rules = [r for r in json.load(sys.stdin)["rules"] if "secrets" in r.get("resources", [])]
              assert rules, "no secrets rule on provision-write"
              unscoped = [r for r in rules if not r.get("resourceNames")]
              assert unscoped, "no unscoped secrets rule on provision-write"
              uverbs = set().union(*[set(r.get("verbs", [])) for r in unscoped])
              assert "create" in uverbs, "provision-write cannot place a Secret: %s" % sorted(uverbs)
              bad = uverbs & reads
              assert not bad, "provision-write can read any Secret: %s" % sorted(bad)
              for r in rules:
                  if r.get("resourceNames") and set(r.get("verbs", [])) & reads:
                      assert sorted(r["resourceNames"]) == ["adapter-state", "relay-registered-keys"], \
                          "scoped Secret read not pinned to adapter-state,relay-registered-keys: %s" % r["resourceNames"]
                      assert not (set(r["verbs"]) - {"get"}), \
                          "scoped Secret rule grants more than get: %s" % sorted(r["verbs"])
              '
    - name: probe-cannot-get-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl auth can-i get secrets -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:provision-probe"
            check:
              ($error != null): true
              (contains($stdout, 'no')): true
    - name: probe-can-create-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl auth can-i create secrets -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:provision-probe"
            check:
              ($error == null): true
              (contains($stdout, 'yes')): true
    - name: can-create-deployment-in-own-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create deployment chainsaw-probe \
                --image=registry.k8s.io/pause:3.9 -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:provision-probe"
            check:
              ($error == null): true
    - name: cannot-create-deployment-in-default
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create deployment chainsaw-probe \
                --image=registry.k8s.io/pause:3.9 -n default \
                --as="system:serviceaccount:${TENANT_NS}:provision-probe"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: cannot-create-deployment-in-kube-system
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create deployment chainsaw-probe \
                --image=registry.k8s.io/pause:3.9 -n kube-system \
                --as="system:serviceaccount:${TENANT_NS}:provision-probe"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
