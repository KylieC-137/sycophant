apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: provision-identity-clusterrole-minimal
spec:
  description: The provision-identity ClusterRole has no rules and no aggregation.
  steps:
    - name: assert-provision-identity-grants-nothing
      try:
        - script:
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              doc=$(helm template probe "$REPO_ROOT/charts/sycophant-cluster" \
                --api-versions policies.kyverno.io/v1/ValidatingPolicy \
                --show-only templates/tenant-user-clusterrole.yaml)
              printf '%s\n' "$doc" | python3 -c '
              import sys, yaml
              docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
              roles = [d for d in docs if d.get("kind") == "ClusterRole" and d["metadata"]["name"] == "provision-identity"]
              assert len(roles) == 1, "provision-identity ClusterRole must render exactly once"
              role = roles[0]
              rules = role.get("rules")
              assert rules == [], f"provision-identity must grant nothing, got {rules}"
              assert "aggregationRule" not in role, "provision-identity must not aggregate rules from other ClusterRoles"
              labels = role["metadata"].get("labels") or {}
              agg = [k for k in labels if "aggregate-to-" in k]
              assert not agg, f"provision-identity must not aggregate into other ClusterRoles: {agg}"
              '
