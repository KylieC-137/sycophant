apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-deployer-no-namespace-create
spec:
  description: |
    The tenant-deployer ServiceAccount is the web-tier-reachable credential. It
    holds no namespaces:create verb: the create moved onto the Kyverno
    background-controller aggregated role. A real create impersonating the
    deployer is Forbidden.
  bindings:
    - name: probe_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: cannot-create-namespace-as-deployer
      try:
        - script:
            env:
              - name: PROBE_NS
                value: ($probe_ns)
            content: |
              kubectl create namespace "$PROBE_NS" \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
      finally:
        - script:
            env:
              - name: PROBE_NS
                value: ($probe_ns)
            content: |
              kubectl delete namespace "$PROBE_NS" --ignore-not-found --wait=false
