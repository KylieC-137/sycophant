apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: adapter-secret-name-allowlist
spec:
  description: An adapter SA may create only the adapter-state Secret, and only in its own namespace.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    # A neighbouring tenant. Never created: impersonation needs no real SA,
    # and the point is that the namespace segment of the username is what
    # the policy reads.
    - name: foreign_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: install-adapter-sa
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: adapter-app
                namespace: ($tenant_ns)
        # RBAC is the first lock; the VAP is the second, for adapters.
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: adapter-secret-writer
                namespace: ($tenant_ns)
              rules:
                - apiGroups: [""]
                  resources: ["secrets"]
                  verbs: ["create", "get"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: adapter-secret-writer
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: adapter-app
                  namespace: ($tenant_ns)
                # Bound so the cross-namespace attempt below clears RBAC and
                # the VAP is the rule that refuses it.
                - kind: ServiceAccount
                  name: adapter-app
                  namespace: ($foreign_ns)
              roleRef:
                kind: Role
                name: adapter-secret-writer
                apiGroup: rbac.authorization.k8s.io
    - name: wait-for-vap-cache-refresh
      try:
        - sleep:
            duration: 5s
    # Runs before the accept below and claims the SAME name, so the only
    # thing that can refuse it is the namespace clause. Drop that clause and
    # this goes green (admitted) AND the accept below then reds on
    # AlreadyExists.
    - name: a-same-named-adapter-sa-from-another-namespace-is-refused
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
              - name: FOREIGN_NS
                value: ($foreign_ns)
            content: |
              set -euo pipefail
              kubectl create secret generic adapter-state \
                --from-literal=state=fake -n "$TENANT_NS" \
                --as="system:serviceaccount:${FOREIGN_NS}:adapter-app"
            check:
              ($error != null): true
              (contains($stderr, 'adapter ServiceAccount may only create the adapter-state Secret')): true
    - name: adapter-sa-may-create-the-fixed-state-secret
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create secret generic adapter-state \
                --from-literal=state=fake -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:adapter-app"
            check:
              ($error == null): true
    - name: adapter-sa-cannot-create-an-off-list-secret
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create secret generic adapter-telegram-state \
                --from-literal=state=fake -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:adapter-app"
            check:
              ($error != null): true
              (contains($stderr, 'adapter ServiceAccount may only create the adapter-state Secret')): true
    - name: forbidden-name-with-generate-name-rejected
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              cat <<EOF | kubectl create -f - -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:adapter-app"
              apiVersion: v1
              kind: Secret
              metadata:
                generateName: evil-
              type: Opaque
              data:
                k: dg==
              EOF
            check:
              ($error != null): true
              (contains($stderr, 'adapter ServiceAccount may only create the adapter-state Secret')): true
    - name: cluster-admin-can-still-create-arbitrary-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create secret generic cluster-admin-secret \
                --from-literal=k=v -n "$TENANT_NS"
            check:
              ($error == null): true
