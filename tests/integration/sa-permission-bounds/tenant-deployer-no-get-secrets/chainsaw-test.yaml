apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tenant-deployer-no-get-secrets
spec:
  description: |
    The tenant-operator ClusterRole is write-only on Secrets: create, update,
    patch, delete, and no `get/list/watch`. Whoever holds it must be able to
    place a Secret without being able to read one back.

    Asserted on the ClusterRole rather than through a bound identity. The
    per-tenant RoleBinding does bind the deployer to tenant-operator, but
    tenant-operator is write-only on Secrets, so a live `can-i get secrets`
    probe still answers "no" — on the grant shape, not on the binding's
    absence. The deployer keeps its own negative probe.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: tenant-operator-is-write-only-on-secrets
      try:
        - script:
            content: |
              set -e
              rule=$(kubectl get clusterrole tenant-operator -o json \
                | python3 -c '
              import json,sys
              for r in json.load(sys.stdin)["rules"]:
                  if "secrets" in r.get("resources", []):
                      print(" ".join(sorted(r.get("verbs", []))))
              ')
              [ -n "$rule" ] || { echo "no secrets rule on tenant-operator"; exit 1; }
              printf '%s' "$rule" | grep -q 'create' \
                || { echo "tenant-operator cannot place a Secret: $rule"; exit 1; }
              printf '%s' "$rule" | grep -Eq '(^| )(get|list|watch)( |$)' \
                && { echo "tenant-operator can read Secrets: $rule"; exit 1; }
              true
    - name: probe-deployer-cannot-get-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl auth can-i get secrets -n "$TENANT_NS" \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error != null): true
              (contains($stdout, 'no')): true
    - name: probe-deployer-resolves-as-an-identity
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl auth can-i get pods -n "$TENANT_NS" \
                --as=system:serviceaccount:sycophant-system:tenant-deployer
            check:
              ($error == null): true
              (contains($stdout, 'yes')): true
