apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: relay-ctrl-no-secret-updates
spec:
  description: The apiserver enforces the chart's Secret bound for relay-controller.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create namespace "$TENANT_NS"
    - name: install-rendered-relay-ctrl-rbac
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -e
              REPO_ROOT=$(git rev-parse --show-toplevel)
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" \
                -n "$TENANT_NS" -s templates/relay-ctrl-rbac.yaml \
                | kubectl apply -f -
    - name: relay-can-create-and-patch-registered-keys-name-scoped
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -e
              kubectl create secret generic relay-registered-keys \
                --from-literal=k=v -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
              kubectl patch secret relay-registered-keys -n "$TENANT_NS" \
                --type=merge -p='{"data":{"k":"dmFsdWU="}}' \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
            check:
              ($error == null): true
    - name: relay-cannot-patch-arbitrary-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl create secret generic bystander \
                --from-literal=k=v -n "$TENANT_NS"
              kubectl patch secret bystander -n "$TENANT_NS" \
                --type=merge -p='{"data":{"k":"dmFsdWU="}}' \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: relay-cannot-delete-registered-keys
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete secret relay-registered-keys -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
  # The step-level `finally` above only runs when the run reaches the last
  # step. A failure in any earlier step would otherwise leak the namespace
  # and poison the next run, because the probes create fixed-name Secrets in
  # it. This test-level handler fires on any step failure.
  catch:
    - script:
        env:
          - name: TENANT_NS
            value: ($tenant_ns)
        content: |
          kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
