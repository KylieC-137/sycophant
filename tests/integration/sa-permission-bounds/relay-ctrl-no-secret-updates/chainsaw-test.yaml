apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: relay-ctrl-no-secret-updates
spec:
  description: The apiserver enforces the relay-controller's total lack of Secret verbs.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create namespace "$TENANT_NS"
    - name: install-rendered-relay-ctrl-rbac
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              REPO_ROOT=$(git rev-parse --show-toplevel)
              helm template probe "$REPO_ROOT/charts/sycophant-tenant" \
                -n "$TENANT_NS" -s templates/relay-ctrl-rbac.yaml \
                | kubectl apply -f -
    - name: relay-cannot-create-any-secret
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create secret generic anything \
                --from-literal=k=v -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: relay-cannot-patch-arbitrary-secrets
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create secret generic bystander \
                --from-literal=k=v -n "$TENANT_NS"
              kubectl patch secret bystander -n "$TENANT_NS" \
                --type=merge -p='{"data":{"k":"dmFsdWU="}}' \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
    - name: relay-cannot-read-any-secret
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              for verb in get list watch; do
                [ "$(kubectl auth can-i "$verb" secrets -n "$TENANT_NS" \
                  --as="system:serviceaccount:${TENANT_NS}:relay-controller")" = no ] \
                  || { echo "the relay can $verb Secrets"; exit 1; }
              done
    - name: relay-cannot-delete-any-secret
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl create secret generic bystander-two \
                --from-literal=k=v -n "$TENANT_NS"
              kubectl delete secret bystander-two -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
            check:
              ($error != null): true
              (contains($stderr, 'forbidden')): true
      finally:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
  # The step-level `finally` above only runs when the run reaches the last
  # step. A failure in any earlier step would otherwise leak the namespace
  # and poison the next run, because the probes create fixed-name Secrets in
  # it. This test-level handler fires on any step failure.
  catch:
    - script:
        env:
          - name: TENANT_NS
            value: ($tenant_ns)
        content: |
          set -euo pipefail
          kubectl delete namespace "$TENANT_NS" --ignore-not-found --wait=false
