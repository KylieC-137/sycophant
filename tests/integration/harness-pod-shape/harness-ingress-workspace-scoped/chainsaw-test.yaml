apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-ingress-workspace-scoped
spec:
  description: The harness admits ingress only from relay-controller on 9091.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns-and-apply-netpol
      use:
        template: ../../step-templates/workspace.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: assert-harness-ingress-shape
      try:
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: ws-probe-egress
                namespace: ($tenant_ns)
              spec:
                # Relay-forward surface: relay-controller admitted to 9091 only.
                (ingress[?toPorts[?ports[?port=='9091']]]):
                  - fromEndpoints:
                      - matchLabels:
                          app.kubernetes.io/name: relay-controller
                          app.kubernetes.io/part-of: sycophant
                # No pod-facing dispatch surface: nothing admitted on 9090.
                (length(ingress[?toPorts[?ports[?port=='9090']]])): 0
