apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: vap-rejects-non-compliant-harness-pods
spec:
  description: |
    The harness VAP rejects each non-compliant harness pod, every rejection
    naming its rule: a missing automount opt-out, a writable root filesystem,
    missing resource limits, a projected kube-apiserver token, a projected
    Secret source and a Secret volume. One tenant namespace, one
    admission-ready wait.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: target_namespace
      value: ($tenant_ns)
  catch:
    - events:
        namespace: ($tenant_ns)
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: await-pod-admission-ready
      use:
        template: ../../step-templates/pod-admission-ready.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    # Kubelet mounts a kube-apiserver-audience SA token when the field is absent.
    - name: reject-missing-automount-optout
      try:
        - apply:
            file: ../../fixtures/harness-pod-missing-automount-optout.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'automountServiceAccountToken must be set to false')): true
    # PSS-restricted has no readOnlyRootFilesystem backstop; only this rule enforces it.
    - name: reject-missing-readonly-rootfs
      try:
        - create:
            file: ../../fixtures/harness-pod-missing-readonly-rootfs.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'readOnlyRootFilesystem')): true
    # Unbounded workloads can starve other tenants.
    - name: reject-missing-resource-limits
      try:
        - apply:
            file: ../../fixtures/harness-pod-missing-limits.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'must define resource limits')): true
    # A kube-apiserver bearer token would let the harness read its own RBAC and escalate.
    - name: reject-projected-sa-token
      try:
        - apply:
            file: ../../fixtures/harness-pod-with-projected-token.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'projected volume sources must be')): true
    # A Secret smuggled in as a projected source is refused by the source allow-list.
    - name: reject-projected-secret-source
      try:
        - create:
            file: ../../fixtures/harness-pod-with-projected-secret.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'projected volume sources must be')): true
    # A direct Secret volume is refused by the volume-type allow-list.
    - name: reject-secret-volume
      try:
        - create:
            file: ../../fixtures/harness-pod-with-secret-volume.yaml
            template: true
            expect:
              - check:
                  ($error != null): true
                  (contains($error, 'harness pod volumes must be')): true
