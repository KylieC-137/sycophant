apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harness-egress-dns-allowlist
spec:
  description: harness-egress-<workspace> is each harness's sole egress policy and carries the L7 DNS allowlist.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns-and-apply-netpol
      use:
        template: ../../step-templates/workspace.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: assert-harness-egress-cnp-shape
      try:
        - assert:
            resource:
              apiVersion: cilium.io/v2
              kind: CiliumNetworkPolicy
              metadata:
                name: harness-egress-probe
                namespace: ($tenant_ns)
              spec:
                endpointSelector:
                  matchLabels:
                    app.kubernetes.io/component: harness
                    app.kubernetes.io/part-of: sycophant
                    sycophant.md/workspace: probe
                (egress[?toEndpoints[?matchLabels."k8s-app"=='kube-dns']]):
                  - toPorts:
                      - ports:
                          - port: "53"
                            protocol: UDP
                          - port: "53"
                            protocol: TCP
                        rules:
                          dns:
                            (contains(@[*].matchName, join('.', ['relay-controller', $tenant_ns, 'svc.cluster.local']))): true
                (egress[?toEndpoints[?matchLabels."app.kubernetes.io/name"=='relay-controller']]):
                  - toPorts:
                      - ports:
                          - port: "9090"
                            protocol: TCP
