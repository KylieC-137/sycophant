apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: relay-identity-configmap-immutable
spec:
  description: An in-namespace ServiceAccount, the relay included, cannot create, update, or delete a relay-identity ConfigMap.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: setup-in-namespace-principals-with-configmap-rbac
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: attacker
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: relay-controller
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: configmap-writers
                namespace: ($tenant_ns)
              rules:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  verbs: ["create", "update", "patch", "delete", "get", "list"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: configmap-writers
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: attacker
                  namespace: ($tenant_ns)
                - kind: ServiceAccount
                  name: relay-controller
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: configmap-writers
                apiGroup: rbac.authorization.k8s.io
    - name: operator-seeds-the-identity-configmap
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: user-0a1b2c3d4e
                namespace: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant
                  sycophant.md/type: relay-identity
              data:
                subject: "https://issuer.example#alice"
                workspaces: "alpha,beta"
                handle.slack: "U0123ABCDEF"
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: user-0a1b2c3d4e
                namespace: ($tenant_ns)
    - name: in-namespace-sa-cannot-rewrite-identity-data
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl patch configmap user-0a1b2c3d4e -n "$TENANT_NS" --type=merge \
                -p '{"data":{"workspaces":"alpha,beta,gamma"}}' \
                --as="system:serviceaccount:${TENANT_NS}:attacker"
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
    - name: the-relay-sa-cannot-rewrite-identity-data-either
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl patch configmap user-0a1b2c3d4e -n "$TENANT_NS" --type=merge \
                -p '{"data":{"handle.slack":"attacker"}}' \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
    - name: in-namespace-sa-cannot-delete-the-identity-configmap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl delete configmap user-0a1b2c3d4e -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:attacker"
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
    - name: in-namespace-sa-cannot-create-a-second-identity-configmap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: identity-shadow
                labels:
                  sycophant.md/type: relay-identity
              data:
                subject: "https://issuer.example#mallory"
                workspaces: "alpha"
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
    - name: an-out-of-namespace-principal-can-still-write-identity-data
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl patch configmap user-0a1b2c3d4e -n "$TENANT_NS" --type=merge \
                -p '{"data":{"handle.email":"alice@example.com"}}'
            check:
              ($error == null): true
