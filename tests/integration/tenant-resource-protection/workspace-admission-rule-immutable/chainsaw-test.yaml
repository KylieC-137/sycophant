apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workspace-admission-rule-immutable
spec:
  description: The most privileged tenant identity cannot delete or change the cluster-wide gVisor rule.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
    - name: crb_name
      value: (join('-', ['provision-probe', $tenant_ns]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: bind-provision-probe-to-provision-write
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: provision-probe
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: ($crb_name)
              subjects:
                - kind: ServiceAccount
                  name: provision-probe
                  namespace: ($tenant_ns)
              roleRef:
                kind: ClusterRole
                name: provision-write
                apiGroup: rbac.authorization.k8s.io
      cleanup:
        - delete:
            ref:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              name: ($crb_name)
    - name: positive-control-crb-is-live
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl auth can-i create deployments.apps -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:provision-probe"
            check:
              ($error == null): true
              (contains($stdout, 'yes')): true
    - name: provision-write-cannot-delete-gvisor-vap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl auth can-i delete validatingadmissionpolicies.admissionregistration.k8s.io/cluster-gvisor-pod-policy \
                --as="system:serviceaccount:${TENANT_NS}:provision-probe"
            check:
              ($error != null): true
              (contains($stdout, 'no')): true
    - name: provision-write-cannot-patch-gvisor-vap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              set -euo pipefail
              kubectl auth can-i patch validatingadmissionpolicies.admissionregistration.k8s.io/cluster-gvisor-pod-policy \
                --as="system:serviceaccount:${TENANT_NS}:provision-probe"
            check:
              ($error != null): true
              (contains($stdout, 'no')): true
