apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-grants-configmap-blocks-same-ns
spec:
  description: An in-namespace ServiceAccount cannot create, update, or delete the relay-access-grants ConfigMap.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: setup-in-namespace-principals-with-configmap-rbac
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: attacker
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: relay-controller
                namespace: ($tenant_ns)
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: Role
              metadata:
                name: configmap-writers
                namespace: ($tenant_ns)
              rules:
                - apiGroups: [""]
                  resources: ["configmaps"]
                  verbs: ["create", "update", "patch", "delete", "get", "list"]
        - apply:
            template: true
            resource:
              apiVersion: rbac.authorization.k8s.io/v1
              kind: RoleBinding
              metadata:
                name: configmap-writers
                namespace: ($tenant_ns)
              subjects:
                - kind: ServiceAccount
                  name: attacker
                  namespace: ($tenant_ns)
                - kind: ServiceAccount
                  name: relay-controller
                  namespace: ($tenant_ns)
              roleRef:
                kind: Role
                name: configmap-writers
                apiGroup: rbac.authorization.k8s.io
    - name: operator-seeds-the-grants-configmap
      try:
        - apply:
            template: true
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: relay-access-grants
                namespace: ($tenant_ns)
                labels:
                  app.kubernetes.io/part-of: sycophant
                  sycophant.md/type: relay-access-grants
              data:
                caleb-phone: |
                  channel: app
                  identity: kJ8f2QwXnR4tYv6b
                  workspace: family
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: relay-access-grants
                namespace: ($tenant_ns)
    - name: in-namespace-sa-cannot-update-the-grants-rows
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl patch configmap relay-access-grants -n "$TENANT_NS" --type=merge \
                -p '{"data":{"attacker-row":"channel: app\nidentity: stolen\nworkspace: family\n"}}' \
                --as="system:serviceaccount:${TENANT_NS}:attacker"
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
    - name: the-relay-sa-cannot-update-the-grants-rows-either
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl patch configmap relay-access-grants -n "$TENANT_NS" --type=merge \
                -p '{"data":{"relay-minted-row":"channel: app\nidentity: self\nworkspace: family\n"}}' \
                --as="system:serviceaccount:${TENANT_NS}:relay-controller"
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
    - name: in-namespace-sa-cannot-delete-the-grants-configmap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl delete configmap relay-access-grants -n "$TENANT_NS" \
                --as="system:serviceaccount:${TENANT_NS}:attacker"
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
    - name: in-namespace-sa-cannot-create-a-second-grants-configmap
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: grants-shadow
                labels:
                  sycophant.md/type: relay-access-grants
              data:
                attacker-row: |
                  channel: app
                  identity: stolen
                  workspace: family
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
    - name: an-out-of-namespace-principal-can-still-write-the-rows
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              kubectl patch configmap relay-access-grants -n "$TENANT_NS" --type=merge \
                -p '{"data":{"dad-telegram":"channel: telegram\nidentity: \"7133824091\"\nworkspace: family\n"}}'
            check:
              ($error == null): true
      catch:
        - events:
            namespace: ($tenant_ns)
