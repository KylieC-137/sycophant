apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: external-sa-can-write-network-policy
spec:
  description: |
    Pair test for the protect-* rules. The operator's cluster kubeconfig
    creates a NetworkPolicy in a tenant ns. That credential is neither a
    ServiceAccount in the namespace nor an issuer-prefixed IdP identity, so
    the match condition does not select it and admission succeeds.

    Without this counterpart, a rule that denied EVERY NetworkPolicy
    write would still pass the network-policy-immutable test. This
    proves the rule's match logic is real, not blanket. It is also the
    regression lock on break-glass: `cluster-chart-admin` reaches a tenant
    namespace on this same credential shape.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: operator-credential-creates-netpol
      try:
        - apply:
            template: true
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: operator-credential-netpol
                namespace: ($tenant_ns)
              spec:
                podSelector: {}
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: operator-credential-netpol
                namespace: ($tenant_ns)
