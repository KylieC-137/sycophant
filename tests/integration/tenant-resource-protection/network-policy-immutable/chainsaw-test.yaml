apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: protect-network-policy-blocks-same-ns
spec:
  description: An in-namespace ServiceAccount cannot create, update, or delete a NetworkPolicy.
  bindings:
    - name: tenant_ns
      value: (join('-', ['tenant', random('[a-z0-9]{8}')]))
  steps:
    - name: create-tenant-ns
      use:
        template: ../../step-templates/tenant.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
    - name: seed-attacker-principal
      use:
        template: ../../step-templates/attacker-principal.yaml
        with:
          bindings:
            - name: tenant_ns
              value: ($tenant_ns)
            - name: principal_name
              value: attacker
            - name: rules
              value:
                - apiGroups: ["networking.k8s.io"]
                  resources: ["networkpolicies"]
                  verbs: ["create", "update", "delete", "get", "list"]
    - name: attacker-attempts-netpol-write
      try:
        - script:
            env:
              - name: TENANT_NS
                value: ($tenant_ns)
            content: |
              cat <<MANIFEST | kubectl apply --as="system:serviceaccount:${TENANT_NS}:attacker" -n "$TENANT_NS" -f -
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: attacker-netpol
              spec:
                podSelector: {}
              MANIFEST
            check:
              ($error != null): true
              (contains($stderr, 'cluster-protect-security')): true
      catch:
        - events:
            namespace: ($tenant_ns)
