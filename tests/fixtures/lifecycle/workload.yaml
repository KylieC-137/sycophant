apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifecycle-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lifecycle-workload
  template:
    metadata:
      labels:
        app: lifecycle-workload
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
