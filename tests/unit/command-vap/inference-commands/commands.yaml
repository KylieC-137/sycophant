apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-inference-deepseek
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  format: openai
  model: deepseek/deepseek-v4-flash
  baseUrl: https://openrouter.ai/api/v1
  image: inference-runtime:local
  secret: llm-openrouter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-inference-format
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  format: grpc
  model: deepseek/deepseek-v4-flash
  baseUrl: https://openrouter.ai/api/v1
  image: inference-runtime:local
  secret: llm-openrouter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-inference-baseurl
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  format: openai
  model: deepseek/deepseek-v4-flash
  image: inference-runtime:local
  secret: llm-openrouter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-inference-bool
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  format: openai
  model: liquid/lfm2.5-8b-a1b
  server.image: llama-server:local
  server.weights: ghcr.io/example/weights:1
  server.weightsPath: /weights/model.gguf
  server.weightsDelivery: copy
  server.contextBudget: '65536'
  server.slots: '2'
  server.outputCap: '4096'
  server.threads: '4'
  server.memory: 8Gi
  server.cpu: '4'
  server.singleNodeException: 'yes'
  server.chatTemplate: ''
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: reap-inference-data
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  format: openai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-inference-localbaseurl
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  format: openai
  model: liquid/lfm2.5-8b-a1b
  baseUrl: http://inference-localbaseurl:8080/v1
  server.image: llama-server:local
  server.weights: ghcr.io/example/weights:1
  server.weightsPath: /weights/model.gguf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-inference-singlelabel
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  format: openai
  model: m
  baseUrl: http://mainframe/v1
  image: inference-runtime:local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-inference-emptyimage
  namespace: tenant-acme
  labels:
    sycophant.md/command: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  format: openai
  model: m
  server.image: ''
  server.weights: ghcr.io/example/weights:1
  server.weightsPath: /weights/model.gguf
