apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-toolset-git
  namespace: tenant-acme
  labels:
    sycophant.md/lifecycle-marker: 'true'
    app.kubernetes.io/part-of: sycophant
data:
  image: ghcr.io/sycophant-md/git@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  keepalive: 'false'
  deadlineSeconds: '300'
  env.GIT_TERMINAL_PROMPT: '0'
  tool.git-status.description: Show the working tree status in the workspace.
  tool.git-log.description: Show recent commit history (10 most recent) for the workspace.
  tool.git-diff.description: Show unstaged changes in the workspace.
  tool.git-branch.description: List local branches in the workspace.
  tool.git-fetch.description: Fetch refs from the default remote.
  tool.git-pull.description: Pull the current branch from its tracked remote.
  tool.git-push.description: Push the current branch to its tracked remote.
  tool.git-clone.description: Clone a git repository.
  tool.git-clone.arg.url.type: string
  tool.git-clone.arg.url.required: 'true'
  tool.git-clone.arg.url.env: URL
  tool.git-clone.arg.url.description: Repository URL.
  tool.git-clone.arg.dest.type: string
  tool.git-clone.arg.dest.required: 'true'
  tool.git-clone.arg.dest.env: DEST
  tool.git-clone.arg.dest.description: Destination directory (relative to /workspace).
  tool.git-checkout.description: Check out a branch, tag, or commit.
  tool.git-checkout.arg.ref.type: string
  tool.git-checkout.arg.ref.required: 'true'
  tool.git-checkout.arg.ref.env: REF
  tool.git-checkout.arg.ref.description: Branch, tag, or commit to check out.
  tool.git-commit.description: Commit currently-staged changes.
  tool.git-commit.arg.message.type: string
  tool.git-commit.arg.message.required: 'true'
  tool.git-commit.arg.message.env: MESSAGE
  tool.git-commit.arg.message.description: Commit message.
---
