# Two Jobs from harness-research that differ only in what the creator already
# set on the pod template. Together they pin the two halves of the mutate's
# contract: absent envelope fields are filled, present ones are left alone.
---
# Declares no envelope at all, and carries a workspace label naming someone
# else. Everything the envelope needs is added, and the workspace label is
# re-authored from the creating identity rather than trusted.
apiVersion: batch/v1
kind: Job
metadata:
  name: minimal-template
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/workspace: other
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: unprivileged-research
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
---
# Names two envelope fields with hostile values. The mutate must not sanitize
# them: they survive here so the validate can deny the Job. A mutate that
# overwrote instead of filling would turn this into an admitted, hardened Job
# and silently retire `stripped-envelope-denies`.
apiVersion: batch/v1
kind: Job
metadata:
  name: hostile-security-context
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: unprivileged-research
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: true
