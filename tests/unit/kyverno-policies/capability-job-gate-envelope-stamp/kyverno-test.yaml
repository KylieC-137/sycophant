# The capability job gate's mutate, checked offline against the patched pod
# template. The live chainsaw pair (well-formed-job-admits-and-stamps,
# stripped-envelope-denies) proves the same contract through a real apiserver;
# this runs the same two shapes without a cluster, so a regression in the
# envelope shows up in seconds rather than in the e2e leg.
#
# Why both halves matter: the gate's mutate is additive so that an explicitly
# hostile value reaches the validate and is denied. A mutate that overwrote
# would produce an admitted, hardened Job -- safe in outcome but a different
# control, and one that makes "missing after mutation" unreachable.
#
# Offline, because the mutate reads only the creating identity and the
# submitted spec. The identity still has to be real: `workspace` is parsed
# from the impersonated username, so a mutate that trusted the carried
# `sycophant.md/workspace: other` label would stamp `other` and red this.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: capability-job-gate-envelope-stamp
policies:
  - policy.yaml
resources:
  - jobs.yaml
userinfo: user-harness-research.yaml
variables: values.yaml
results:
  - policy: cluster-capability-job-gate-envelope
    isMutatingPolicy: true
    kind: Job
    result: pass
    resources:
      - tenant-offline/minimal-template
      - tenant-offline/hostile-security-context
    patchedResources: patched.yaml
