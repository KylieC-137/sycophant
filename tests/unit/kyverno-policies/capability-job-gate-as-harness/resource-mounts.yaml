apiVersion: batch/v1
kind: Job
metadata:
  name: own-workspace-pvc
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ws-research-unprivileged
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: ws-research-data
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          volumeMounts:
            - name: workspace
              mountPath: /workspace
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sibling-workspace-pvc
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
        sycophant.md/workspace: other
    spec:
      restartPolicy: Never
      serviceAccountName: ws-research-unprivileged
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: ws-other-data
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          volumeMounts:
            - name: workspace
              mountPath: /workspace
---
apiVersion: batch/v1
kind: Job
metadata:
  name: conversation-history-pvc
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ws-research-unprivileged
      volumes:
        - name: history
          persistentVolumeClaim:
            claimName: ws-research-conversation
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          volumeMounts:
            - name: history
              mountPath: /var/lib/harness
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configmap-volume
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ws-research-unprivileged
      volumes:
        - name: bindings
          configMap:
            name: toolset-git
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          volumeMounts:
            - name: bindings
              mountPath: /etc/sycophant/toolset
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configmap-env
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ws-research-unprivileged
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          env:
            - name: BINDINGS
              valueFrom:
                configMapKeyRef:
                  name: toolset-git
                  key: bindings.yaml
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configmap-envfrom
  namespace: tenant-offline
spec:
  template:
    metadata:
      labels:
        sycophant.md/job-kind: tool
    spec:
      restartPolicy: Never
      serviceAccountName: ws-research-unprivileged
      containers:
        - name: runtime
          image: registry.k8s.io/pause:3.9
          envFrom:
            - configMapRef:
                name: toolset-git
