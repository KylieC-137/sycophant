{{- if include "sycophant.renderKyverno" . }}
{{- /*
Reaps each per-install ServiceAccount and RoleBinding once its reap-after
instant passes, so no apply-capable credential persists between installs. The
installer Job self-cleans on its own ttlSecondsAfterFinished.
*/}}
{{- range list "toolset" "user" "workspace" }}
---
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: reap-{{ . }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
spec:
  schedule: {{ $.Values.reap.schedule | quote }}
  matchConstraints:
    objectSelector:
      matchLabels:
        app.kubernetes.io/component: provision-{{ . }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  variables:
    - name: reapAfter
      expression: >-
        object.metadata.?annotations["{{ include "sycophant.reapAfterAnnotation" $ }}"].orValue("")
  conditions:
    - name: reap-after-ttl-has-passed
      expression: >-
        variables.reapAfter != "" && timestamp(variables.reapAfter) < time.now()
{{- end }}
{{- end }}
