# Provision is the one lifecycle marker whose target namespace does not exist
# yet, so its marker lands in sycophant-system rather than in the target. RBAC
# there is coarse — any holder of create on configmaps in sycophant-system can
# write any name — so placement cannot decide who may provision. This
# ValidatingAdmissionPolicy carries that decision: it admits a provision marker
# only when the apiserver-stamped caller identity is an issuer-prefixed user.
#
# The apiserver maps identity as `<issuer>#<sub>` and maps no groups, uid, or
# extra, so request.userInfo carries only that username and there is no other
# claim to read. A standing ServiceAccount credential (system:...) never carries
# the issuer prefix and is rejected. failurePolicy Fail closes the gate if the
# policy cannot evaluate.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-provision-marker-identity
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["configmaps"]
  matchConditions:
    - name: is-provision-marker-in-system
      expression: >-
        object.metadata.namespace == 'sycophant-system' &&
        has(object.metadata.name) &&
        object.metadata.name == '{{ include "sycophant.provisionMarkerName" . }}' &&
        has(object.metadata.labels) &&
        '{{ include "sycophant.lifecycleMarkerLabel" . }}' in object.metadata.labels
  validations:
    - expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username.startsWith('{{ include "sycophant.idpUserPrefix" . }}')
      message: "a provision marker is admitted only for an issuer-prefixed user identity; standing cluster credentials cannot provision"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cluster-provision-marker-identity-binding
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  policyName: cluster-provision-marker-identity
  validationActions: [Deny]
