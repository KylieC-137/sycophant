# Bounds which Secrets the channel adapters may create in a tenant
# namespace.
#
# An adapter SA: the fixed `adapter-state` Secret and nothing else — that is
# the tailnet node identity the app adapter keeps across restarts. One app
# channel per tenant, so the state Secret is a single fixed name, not per-SA.
# The relay-controller is not matched: it holds no Secrets at all, and RBAC
# is its only lock.
#
# An adapter is scoped to its own namespace. A tenant lives entirely
# inside its namespace and an adapter never speaks for another tenant's
# channel, so a same-named SA next door gets nothing here.
#
# The adapter Role in
# `charts/sycophant-channel/templates/adapter-app-rbac.yaml` grants
# `secrets: create` with no name constraint, because K8s RBAC
# `resourceNames` is documented as not honored on the `create` verb. This
# admission policy is the structural backstop: it bounds the blast radius of
# a compromised adapter.
#
# Engine choice: pure yes/no on request shape → VAP, not Kyverno.
#
# Threat model: operator-tier defense-in-depth. The workspace cannot reach
# these SAs; this rule defends against CVE-influenced Secret creation from
# the pods themselves.
#
# If any Secret is ever renamed, three things must move together: the RBAC
# `resourceNames` clause in
# `charts/sycophant-channel/templates/adapter-app-rbac.yaml`, this
# allow-list, and the chainsaw fixture at
# `tests/integration/sa-permission-bounds/adapter-secret-name-allowlist/`.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cluster-adapter-secret-name-allowlist
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["secrets"]
  matchConditions:
    - name: only-adapter-sa
      expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.split(':').size() == 4 &&
        request.userInfo.username.split(':')[3].startsWith('adapter-')
  variables:
    - name: saNamespace
      expression: request.userInfo.username.split(':')[2]
  validations:
    # The requesting ServiceAccount must live in the namespace it is writing
    # into. A tenant lives entirely inside its own namespace, and an adapter
    # never speaks for another tenant's channel — so a same-named adapter SA
    # from a neighbouring namespace must not be able to plant this tenant's
    # state Secret.
    - expression: variables.saNamespace == request.namespace
      message: "an adapter ServiceAccount may only create the adapter-state Secret in its own namespace"
    - expression: >-
        !(has(object.metadata.generateName) && object.metadata.generateName != '') &&
        has(object.metadata.name) &&
        object.metadata.name == 'adapter-state'
      message: "an adapter ServiceAccount may only create the adapter-state Secret"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cluster-adapter-secret-name-allowlist-binding
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  policyName: cluster-adapter-secret-name-allowlist
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
