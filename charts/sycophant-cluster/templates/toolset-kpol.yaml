uninstall-toolset reactor on a reap marker, and the reap of both identities'
ServiceAccounts and RoleBindings.
*/}}
{{- if include "sycophant.renderKyverno" . }}
---
{{ include "sycophant.provisionInstaller" (dict "ctx" $ "kind" "toolset") }}
---
{{ include "sycophant.provisionUninstaller" (dict "ctx" $ "kind" "toolset") }}
---
{{ include "sycophant.provisionReap" (dict "ctx" $ "kind" "toolset") }}
{{- end }}
