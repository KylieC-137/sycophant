{{- /*
The identity gate every lifecycle marker rides on. A marker lands in a namespace
whose RBAC is coarser than the operator intends (a tenant namespace, or
sycophant-system for the tenant marker whose target namespace does not exist
yet), so placement cannot decide who may act. Each VAP admits the marker only
when the apiserver-stamped caller is an issuer-prefixed user. The apiserver maps
identity as `<issuer>#<sub>` and maps no groups, uid, or extra, so a standing
ServiceAccount credential (system:...) never carries the prefix and is rejected.
CREATE and UPDATE are both gated because a marker name is reused and the reactor
acts on an UPDATE as readily as a CREATE. failurePolicy Fail closes the gate if
the policy cannot evaluate.

Params: ctx, name (policy name), marker (marker name, or the name prefix when
prefix is true, with the rest of the name in variables.suffix), keys (the
closed set of data keys), noun and action (for the identity message), shape
(extra validations), and system (true when the marker lives in
sycophant-system rather than a tenant namespace).
*/ -}}
{{- define "sycophant.markerVap" -}}
{{- $ctx := .ctx -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .name }}
  labels:
    {{- include "sycophant.labels" $ctx | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    {{- if not .system }}
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: sycophant-tenant
    {{- end }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
  matchConditions:
    - name: is-{{ .noun }}-marker{{ if .system }}-in-system{{ end }}
      expression: >-
        {{ if .system }}object.metadata.namespace == 'sycophant-system' &&
        {{ end }}has(object.metadata.name) &&
        {{ if .prefix }}object.metadata.name.startsWith('{{ .marker }}-'){{ else }}object.metadata.name == '{{ .marker }}'{{ end }} &&
        has(object.metadata.labels) &&
        '{{ include "sycophant.lifecycleMarkerLabel" $ctx }}' in object.metadata.labels
  {{- if .prefix }}
  variables:
    - name: suffix
      expression: "object.metadata.name.substring({{ add1 (len .marker) }})"
  {{- end }}
  validations:
    - expression: >-
        has(request.userInfo.username) &&
        request.userInfo.username.startsWith('{{ include "sycophant.idpUserPrefix" $ctx }}')
      message: "a {{ .noun }} marker is admitted only for an issuer-prefixed user identity; standing cluster credentials cannot {{ .action }}"
    - expression: >-
        !has(object.data) || object.data.all(k, k in {{ .keys | toJson | replace "\"" "'" }})
      messageExpression: >-
        "a {{ .noun }} marker carries unknown key '" +
        object.data.filter(k, !(k in {{ .keys | toJson | replace "\"" "'" }}))[0] +
        "'; {{ if .keys }}allowed keys are {{ join ", " .keys }}{{ else }}it carries no data{{ end }}"
    {{- .shape | trim | nindent 4 }}
    # A marker is a sycophant-controlled object, so it must carry part-of=sycophant.
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/part-of' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'sycophant'
      message: "a marker must carry the app.kubernetes.io/part-of=sycophant label"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .name }}-binding
  labels:
    {{- include "sycophant.labels" $ctx | nindent 4 }}
spec:
  policyName: {{ .name }}
  validationActions: [Deny]
{{- end -}}

{{- /*
The tenant prefix keeps the composed namespace out of reserved namespaces. Every
name a marker carries becomes part of a helm release name, which helm caps at
53 characters, so each cap is 53 minus its release prefix: tenant-<token> leaves
46, workspace-<name> 43, toolset-<name> 45, inference-<key> 43; user-<handle>
is always 15. A tenant
marker carries its token in data; every other marker carries its name as the
marker name's suffix. The reactor reads capacity as the ResourceQuota bound, and
a missing one would abort the whole generate silently, so it fails closed here.
*/ -}}
{{ include "sycophant.markerVap" (dict "ctx" . "name" "marker-provision-tenant" "system" true
  "marker" (include "sycophant.provisionMarkerName" .) "noun" "provision" "action" "provision"
  "keys" (list "tenant" "capacity")
  "shape" `
- expression: >-
    has(object.data) && 'tenant' in object.data &&
    object.data['tenant'].matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
    size(object.data['tenant']) <= 46
  message: "a provision marker must carry a DNS-safe 'tenant' token of at most 46 characters, so the release tenant-<token> fits helm's 53"
- expression: >-
    has(object.data) && 'capacity' in object.data &&
    isQuantity(object.data['capacity'])
  message: "a provision marker must carry a valid 'capacity' quantity"` ) }}
---
{{ include "sycophant.markerVap" (dict "ctx" . "name" "marker-provision-workspace" "prefix" true
  "marker" (include "sycophant.workspaceProvisionMarkerName" .) "noun" "workspace" "action" "mint a workspace"
  "keys" (list "values")
  "shape" `
- expression: >-
    variables.suffix.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
    size(variables.suffix) <= 43
  message: "a workspace marker name must be provision-workspace-<name> with a DNS-safe name of at most 43 characters, so the release workspace-<name> fits helm's 53"
- expression: >-
    has(object.data) && 'values' in object.data
  message: "a workspace marker must carry a 'values' key"` ) }}
---
{{ include "sycophant.markerVap" (dict "ctx" . "name" "marker-provision-user" "prefix" true
  "marker" (include "sycophant.userProvisionMarkerName" .) "noun" "user" "action" "bind a framework user"
  "keys" (list "user")
  "shape" `
- expression: >-
    variables.suffix.matches('^[a-f0-9]{10}$')
  message: "a user marker name must be provision-user-<handle> with a 10-character hex handle"
# The installer prints the subject into a double-quoted YAML scalar, so a quote,
# backslash, control character, or Unicode line or paragraph separator, any of
# which escapes or folds that scalar, is refused. Same pattern as the tenant
# chart's users schema.
- expression: >-
    has(object.data) && 'user' in object.data &&
    object.data['user'].matches(r'^https?://[^#"\\\p{Cc}\x{2028}\x{2029}]+#[^"\\\p{Cc}\x{2028}\x{2029}]+$')
  message: "a user marker's 'user' must be an issuer-prefixed subject <issuer>#<sub> with no quote, backslash, control character, or line separator"` ) }}
---
{{ include "sycophant.markerVap" (dict "ctx" . "name" "marker-provision-toolset" "prefix" true
  "marker" (include "sycophant.toolsetProvisionMarkerName" .) "noun" "toolset" "action" "install a toolset"
  "keys" (list "values")
  "shape" `
- expression: >-
    variables.suffix.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
    size(variables.suffix) <= 45
  message: "a toolset marker name must be provision-toolset-<name> with a DNS-safe name of at most 45 characters, so the release toolset-<name> fits helm's 53"
- expression: >-
    has(object.data) && 'values' in object.data
  message: "a toolset marker must carry a 'values' key"` ) }}
---
{{- /*
One model per marker. A `server.image` key makes it local: the chart renders
its server and Service `inference-<key>` on one fixed port, and the harness
derives that address itself, so a local marker carries no baseUrl. Otherwise it
is remote, names the job image the harness runs, and its baseUrl host must be a
dotted name or an IPv4 address, the two shapes the chart turns into an egress
rule. Numbers are digit strings and booleans "true" or "false", since marker
data is flat strings.
*/}}
{{ include "sycophant.markerVap" (dict "ctx" . "name" "marker-provision-inference" "prefix" true
  "marker" (include "sycophant.inferenceProvisionMarkerName" .) "noun" "inference" "action" "install a model"
  "keys" (list "format" "model" "baseUrl" "image" "secret" "server.image" "server.weights" "server.weightsPath" "server.weightsDelivery" "server.contextBudget" "server.slots" "server.outputCap" "server.threads" "server.temp" "server.memory" "server.cpu" "server.singleNodeException" "server.chatTemplate")
  "shape" `
- expression: >-
    variables.suffix.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
    size(variables.suffix) <= 43
  message: "an inference marker name must be provision-inference-<key> with a DNS-safe key of at most 43 characters, so the release inference-<key> fits helm's 53"
- expression: >-
    has(object.data) && object.data.?format.orValue('') in ['anthropic', 'openai', 'gemini']
  message: "an inference marker's 'format' must be one of anthropic, openai, gemini"
- expression: >-
    has(object.data) && object.data.?model.orValue('') != ''
  message: "an inference marker must carry a 'model'"
- expression: >-
    has(object.data) && ('server.image' in object.data || object.data.?baseUrl.orValue('').matches('^https?://[^/:.]+(\\.[^/:.]+)+(:[0-9]+)?(/.*)?$'))
  message: "a remote inference marker's 'baseUrl' must be an http or https URL whose host is a dotted name or an IPv4 address"
- expression: >-
    !has(object.data) || !('server.image' in object.data) || !('baseUrl' in object.data)
  message: "a local inference marker must not carry a 'baseUrl'"
- expression: >-
    !has(object.data) || 'server.image' in object.data || object.data.?image.orValue('') != ''
  message: "a remote inference marker must carry an 'image'"
- expression: >-
    !has(object.data) || !('server.image' in object.data) ||
    (object.data['server.image'] != '' && object.data[?'server.weights'].orValue('') != '' &&
     object.data[?'server.weightsPath'].orValue('') != '')
  message: "a local inference marker must carry a non-empty 'server.image', 'server.weights' and 'server.weightsPath'"
- expression: >-
    !has(object.data) || object.data[?'server.weightsDelivery'].orValue('copy') in ['copy', 'mount']
  message: "an inference marker's 'server.weightsDelivery' must be copy or mount"
- expression: >-
    !has(object.data) ||
    ['server.contextBudget', 'server.slots', 'server.outputCap', 'server.threads', 'server.cpu'].all(k,
      !(k in object.data) || object.data[k].matches('^[1-9][0-9]*$'))
  messageExpression: >-
    "an inference marker's '" +
    ['server.contextBudget', 'server.slots', 'server.outputCap', 'server.threads', 'server.cpu'].filter(k,
      k in object.data && !object.data[k].matches('^[1-9][0-9]*$'))[0] +
    "' must be a positive integer"
- expression: >-
    !has(object.data) || object.data[?'server.temp'].orValue('0').matches('^[0-9]+(\\.[0-9]+)?$')
  message: "an inference marker's 'server.temp' must be a non-negative number"
- expression: >-
    !has(object.data) || !('server.memory' in object.data) || isQuantity(object.data['server.memory'])
  message: "an inference marker's 'server.memory' must be a quantity"
- expression: >-
    !has(object.data) || object.data[?'server.singleNodeException'].orValue('false') in ['true', 'false']
  message: "an inference marker's 'server.singleNodeException' must be \"true\" or \"false\""` ) }}
---
{{ include "sycophant.markerVap" (dict "ctx" . "name" "marker-reap-inference" "prefix" true
  "marker" "reap-inference" "noun" "reap-inference" "action" "remove a model"
  "keys" (list)
  "shape" `
- expression: >-
    variables.suffix.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
    size(variables.suffix) <= 43
  message: "a reap marker name must be reap-inference-<key> with a DNS-safe key of at most 43 characters"` ) }}
---
{{- /* An absent keepalive suspends with no reap; a typo'd one is refused rather than suspending forever. */}}
{{ include "sycophant.markerVap" (dict "ctx" . "name" "marker-suspend-tenant"
  "marker" (include "sycophant.suspendMarkerName" .) "noun" "suspend" "action" "suspend a tenant"
  "keys" (list "keepalive")
  "shape" `
- expression: >-
    !has(object.data) || !('keepalive' in object.data) ||
    object.data['keepalive'] in ['0', '30', '60', '90']
  message: "a suspend marker's 'keepalive', when set, must be one of 0, 30, 60, 90"` ) }}
