{{- if include "sycophant.renderKyverno" . }}
# Provision reactor. Fires on lifecycle-marker configmaps created in
# sycophant-system and gates the reserved provision name in its own match block
# (RBAC ignores resourceNames on create, so the name gate lives here). It
# materializes the tenant Namespace and a nested ResourceQuota sized from the
# marker's capacity, under Kyverno's own ServiceAccount rights, and generates
# nothing else. The generated Namespace carries the part-of=sycophant-tenant
# label, which chains into the relay tokenreview and pod-VAP bindings the
# tenant-rolebinding-generator policy produces, and the restricted Pod Security
# labels the tenant-ns-psa-required VAP demands.
#
# The keepalive match condition constrains the marker's keepalive to the policy
# set 0, 30, 60, 90 days; a free-form value does not match and the marker
# generates nothing.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: tenant-provision-reactor
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  evaluation:
    generateExisting:
      enabled: false
    synchronize:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: sycophant-system
    objectSelector:
      matchLabels:
        {{ include "sycophant.lifecycleMarkerLabel" . }}: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
        resourceNames: ["{{ include "sycophant.provisionMarkerName" . }}"]
  matchConditions:
    - name: keepalive-is-a-policy-value
      expression: >-
        object.?data["keepalive"].orValue("") in ["0", "30", "60", "90"]
  variables:
    - name: tenant
      expression: 'object.data["tenant"]'
    - name: capacity
      expression: 'object.data["capacity"]'
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: Namespace
          metadata:
            name: (( variables.tenant ))
            labels:
              {{- include "sycophant.baseLabels" . | nindent 14 }}
              app.kubernetes.io/part-of: sycophant-tenant
              pod-security.kubernetes.io/enforce: restricted
              pod-security.kubernetes.io/warn: restricted
              pod-security.kubernetes.io/audit: restricted
          ---
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: (( variables.tenant ))-capacity
            namespace: (( variables.tenant ))
            labels:
              {{- include "sycophant.labels" . | nindent 14 }}
          spec:
            hard:
              requests.memory: (( variables.capacity ))
              limits.memory: (( variables.capacity ))
{{- end }}
