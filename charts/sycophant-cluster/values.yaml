# sycophant-cluster: install once per cluster. Requires the Kyverno CRDs.
# On Kubernetes 1.30-1.33 enable the StructuredAuthenticationConfiguration
# feature gate; it is GA from 1.34.

# The IdP trust block the apiserver's StructuredAuthenticationConfiguration is
# rendered from: the issuer and its mandatory audience. Identity is always the
# stable OIDC subject (`sub`), prefixed with the issuer, so it is not an
# operator knob; no groups, uid, or extra is mapped. Swapping the IdP is a
# config change here, not a code change. No signing key ever lives in the
# chart — it is the IdP's.
# A self-hosted issuer whose TLS cert does not chain to a public root (the
# bundled Dex, an internal Keycloak) adds certificateAuthority with the PEM
# the apiserver should trust when fetching JWKS. Omit it for a publicly-trusted
# issuer (Okta, Entra, Google); the system trust store is used. This keeps
# trusting a private issuer a config value, not an apiserver trust-store edit.
#
# The default points at the bundled sycophant-dex sibling chart installed in
# sycophant-system, the zero-config default issuer. Add its
# certificateAuthority when you install it, or override idp to point at your
# own IdP.
idp:
  issuer: https://sycophant-dex.sycophant-system.svc.cluster.local:5556/dex
  audience: sycophant-cluster
  # certificateAuthority: |
  #   -----BEGIN CERTIFICATE-----
  #   ...bundled issuer CA...
  #   -----END CERTIFICATE-----

# The installer a provision command triggers. An admitted provision command
# stamps a single-shot Job that runs the tenant chart baked into this image
# against the new tenant namespace. image/tag name the installer image;
# chartPath is where the tenant chart lives inside it.
provisioner:
  image: sycophant-provisioner
  tag: local
  pullPolicy: IfNotPresent
  chartPath: /charts/sycophant-tenant

# How often the cleanup DeletingPolicies sweep for suspended tenants past their
# keepalive TTL and for installer leftovers to reap. Standard 5-field cron;
# Kyverno's minimum granularity is 1 minute, so `* * * * *` is the floor. The
# default keeps production sweeps sparse; e2e overrides it to reap promptly.
reap:
  schedule: "*/10 * * * *"
