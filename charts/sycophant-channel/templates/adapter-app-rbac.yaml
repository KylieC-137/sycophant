{{- $channel := .Values.name }}
---
# Tailnet node state for the app adapter (fixed name: see adapter-app.yaml).
# Bound to the adapter's own ServiceAccount, never the relay's: a relay holding
# `patch` on Secrets could rotate its own signing key.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adapter-{{ $channel }}-state
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: adapter
    sycophant.md/channel: {{ $channel | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [adapter-state]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adapter-{{ $channel }}-state
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    app.kubernetes.io/component: adapter
    sycophant.md/channel: {{ $channel | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adapter-{{ $channel }}-state
subjects:
  - kind: ServiceAccount
    name: adapter-{{ $channel }}
    namespace: {{ $.Release.Namespace }}
