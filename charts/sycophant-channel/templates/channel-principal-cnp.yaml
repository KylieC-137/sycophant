{{/*
Fail-closed egress for principal-class channel pods.

A principal channel pod holds its own signing identity and dials the relay's
principal socket (9092) as itself. Unlike a transport channel pod it is not a
tailnet terminus: it is an in-cluster caller, so its egress is the universal
minimum — DNS to resolve the relay Service and the relay's principal port. A
concrete principal channel extends this with its own source-specific
destinations when one ships.

Rendered unconditionally, mirroring the principal ingress fence on the relay
(relay-ctrl-cnp.yaml), so both halves of the principal path exist together.
The selector names the class, never `sycophant.md/channel`, an operator-chosen
instance name.
*/}}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: channel-principal-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: channel
      sycophant.md/channel-class: principal
      app.kubernetes.io/part-of: sycophant
  egress:
    {{- include "sycophant.dnsEgress" . | nindent 4 }}
    # The relay's principal socket. This dial is the principal channel pod's job.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: relay-controller
            app.kubernetes.io/part-of: sycophant
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
