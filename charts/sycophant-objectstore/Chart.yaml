apiVersion: v2
name: sycophant-objectstore
description: |
  Shared object store (SeaweedFS) for the sycophant cluster. One instance in the
  operator-owned system namespace delivers instruction content to every
  tenant. Install once per cluster, same tier as cilium/kyverno/gvisor.

  The admin credential is generated into this namespace and never reaches a
  tenant. A workspace pod reads its own instructions folder with its own
  service-account token, exchanged through STS for a short-lived read-only
  credential; no stored credential exists for it. A CiliumNetworkPolicy locks the
  store in both directions: ingress only from harness pods (any namespace) on
  the s3 port, egress to cluster DNS and the apiserver plus, when an operator
  OIDC issuer is configured, that one issuer and nothing else.
version: 0.1.0
appVersion: "0.1.0"
