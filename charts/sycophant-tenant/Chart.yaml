apiVersion: v2
name: sycophant-tenant
description: |
  Per-tenant sycophant base install. Run once per tenant in the tenant's
  namespace, by the provisioner Job a tenant provision command stamps (or any
  external SA the operator chooses). Requires `sycophant-cluster` to have been
  installed once on the cluster first.

  Renders the tenant's shared objects and optionally its Namespace.
version: 0.1.0
appVersion: "0.1.0"
