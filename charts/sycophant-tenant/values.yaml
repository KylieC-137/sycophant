
# TODO: consider decomposing this chart into a library chart plus separate
# tenant/workspace/user/toolset application charts. Each slice would be its own
# release with its own chart name, dropping the `render` switch below; the
# library chart would hold the shared object templates both the tenant install
# and the standalone slice installs use. Weigh against the cost of maintaining
# several charts and baking several charts into the provisioner image.

# Which slice of the chart this release renders.
#   base      (default) the tenant's shared control plane (relay, scheduling,
#             relay-access-grants). What the tenant marker renders, from chart
#             defaults.
#   workspace one workspace from the marker under `marker`, keyed by `name`:
#             its harness, PVCs, grants and policies. The marker carries
#             `toolsets` and `models` (comma lists), `storage`, and
#             `grant.<toolset>.<grant>.<secret|path|egress>`. A per-workspace
#             marker installs it into an existing tenant namespace as its own
#             release (release name workspace-<name>), leaving the base release
#             and sibling workspaces untouched. The shared objects it references
#             (scheduling, relay-controller) are owned by the base release and
#             read by name at runtime.
#   user      the per-user provision-identity RoleBinding for the identities
#             under `users`. A per-user marker binds one identity into an existing
#             tenant namespace as its own release (release name user-<handle>).
#   toolset   one toolset from the marker under `marker`, keyed by `name`: its
#             `toolset-<name>` ConfigMap. A per-toolset marker installs it as its
#             own release (release name toolset-<name>).
#   channel   the app channel adapter and headscale under `channels` and
#             `headscale`, installed host-side as its own release.
#   inference one model from the marker under `marker`, keyed by `name`: its
#             `model-<name>` ConfigMap, plus the `inference-<name>` server,
#             Service and fence when `server.image` is set, or the
#             `inference-egress-<name>` policy for its job pods when not. A
#             per-model marker installs it as its own release (release name
#             inference-<name>).
render: base

# A capability marker's name suffix and flat data, set by the installer. Read
# only by the slice the marker installs.
name: ""
marker: {}

# Bound user identities. The full issuer-prefixed identity subjects exactly
# as the apiserver presents them, <issuer>#<sub>, one per identity the
# operator has granted this tenant. When non-empty, the chart renders one
# plain RoleBinding granting those users the minimal provision-identity ClusterRole
# in this namespace. The apiserver prefixes the sub claim with the issuer, so
# each value carries the whole prefixed string, operator-supplied; the chart
# neither composes nor knows the issuer. Empty (default) renders no binding,
# so a tenant with no bound identities admits no user.
# users:
#   - "https://issuer.example#CgVhbGljZRIFbG9jYWw"
users: []

# Tenant namespace ownership. When true (self-host), the chart creates the
# tenant namespace and stamps the perimeter + Pod Security labels on it. Set
# false when the namespace is pre-created and labelled by the provisioner (the
# marker-driven install path), so the chart installs into the existing ns.
namespace:
  create: true

# PVC storage class for all tenant PVCs (per-workspace data, conversation
# history, headscale data). Empty/absent uses the cluster's default
# StorageClass. Set this on clusters that have no default StorageClass
# (otherwise PVCs hang Pending and nothing starts).
storageClass: ""

# Container images. Pre-1.0: defaults are LOCAL builds (tag: local,
# pullPolicy: Never). No images are published yet — build them and load
# them onto your nodes (e.g. `k3d image import`), or override these to
# your own registry refs to pull instead.

# Relay controller -- the client-facing gateway.
# Watches the relay-access-grants ConfigMap, verifies client-signed requests
# against the grant row that signed them, and relays inbound user messages to
# the per-workspace harness.
relay:
  image: relay-controller
  tag: local
  pullPolicy: Never

# Harness -- agent runtime. Watches the toolset and model ConfigMaps and
# dispatches tool and LLM calls in-process. Stateless.
harness:
  image: sycophant-harness
  tag: local
  pullPolicy: Never
  instructions:
    # Object-storage delivery of instruction content. At
    # pod start the harness init container syncs this workspace's prefix from
    # <bucket>/<namespace>/<workspace> at <endpoint> into an emptyDir the serving
    # container mounts read-only. The read-only, prefix-scoped credential
    # (credentialName, a Secret the operator provides) is mounted into the
    # init container ONLY; the serving container holds no credential.
    #
    # The store is one shared cluster component in the operator-owned system
    # namespace (charts/sycophant-objectstore), not a per-tenant instance. The
    # endpoint is its cross-namespace Service address; the harness egress netpol
    # reads the namespace from this host to admit the store pod. The store-side
    # ingress lock (harness-only) lives in the objectstore chart, so the tenant
    # side carries only the harness egress permission.
    endpoint: seaweedfs.sycophant-system.svc.cluster.local:8333
    bucket: sycophant-instructions
    credentialName: instructions-reader
    # The init container's `rclone sync` mirrors the prefix into the emptyDir.
    syncImage: rclone/rclone:1.75.1

# install-wait: post-install/post-upgrade helm hook that waits for every
# sycophant workload Deployment to become Available. Alpine + kubectl helper
# (needs `sh` for the hook's `command: [sh, -c]`).
installWait:
  image: sycophant-kubectl
  tag: local
  pullPolicy: Never

# workspace-init: per-workspace one-shot Job that seeds the workspace PVC
# (git init + baseline). Runs the toolset-runtime entrypoint baked into
# toolset-git.
workspaceInit:
  image: toolset-git
  tag: local
  pullPolicy: Never

# Headscale -- self-hosted Tailscale-compatible control plane.
#
# Opt-in for local-machine self-host scenarios. Hobbyists
# and Mac-mini-style operators flip enabled=true to get tailnet-based ingress
# for the relay gateway. DevOps deployments leave it disabled and bring their own
# ingress (proper K8s Ingress, cert-manager, OIDC, etc.).
#
# When enabled, the operator must:
#   1. Own a domain (set headscale.serverUrl to https://<that domain>)
#   2. Port-forward router :443 to the K8s NodePort/LB targeting headscale's
#      :8080 (the Service is ClusterIP; expose via port-forward for laptop
#      bootstrap, or front it with NodePort/Ingress)
#   3. After install, mint pre-auth keys via kubectl exec:
#        kubectl exec deploy/headscale -- headscale users create <user>
#        kubectl exec deploy/headscale -- headscale preauthkeys create -u <user> -e 24h
#
# Schema:
#   enabled:    bool                      (default: false)
#   image:      string                    (default: headscale/headscale)
#   tag:        string                    (default: 0.28.0)
#   pullPolicy: Always|IfNotPresent|Never (default: IfNotPresent)
#   serverUrl:  string                    (required when enabled, e.g.
#                                          https://hs.example.com)
#   magicDns:   bool                      (default: true; gives tailnet
#                                          members short hostnames)
#   baseDomain: string                    (default: ts.local)
headscale:
  enabled: false
  image: headscale/headscale
  tag: "0.28.0"
  pullPolicy: IfNotPresent
  serverUrl: ""
  magicDns: true
  baseDomain: ts.local
  # ACME (Let's Encrypt) for the headscale HTTPS endpoint. Required when
  # mobile app-channel clients need to register from cellular —
  # the phone's Tailscale Android needs an HTTPS control plane URL.
  #
  # When acme.enabled=true, the chart switches headscale's API listener
  # from :8080 to :443 (HTTPS) and adds a :80 listener for the HTTP-01
  # challenge. Operator must port-forward router :443 → Service :443 AND
  # :80 → Service :80, with DNS pointing the serverUrl hostname at the
  # Mac mini's public IP.
  #
  # When acme.enabled=false (default), headscale serves plain HTTP on
  # :8080 — fine for laptop bootstrap via port-forward, insufficient for
  # phones on cellular.
  acme:
    enabled: false
    # Email registered with Let's Encrypt for cert lifecycle notifications.
    email: ""

# Channels -- the connectors a tenant serves.
#
# A map. The key is the instance name and becomes the pod's
# `sycophant.md/channel` label; presence in the map is the enable signal, so
# there is no `enabled` bool. Deleting an entry deletes the adapter pod and
# its egress policy, and nothing else: grant rows and registered keys are
# never chart-owned.
#
# Each entry carries a `kind`. Only `kind: app` is supported today, and an
# unrecognized kind fails the render.
#
# `kind: app` renders the tailnet terminus for the custom app. It is
# transport only: it holds no signing identity, mounts no PVC, and forwards
# tailnet TCP :9090 to the relay's app port. Pair it with headscale.enabled,
# or point loginServer at an external control plane.
#
# When an app channel is configured, the operator must:
#   1. Mint a headscale pre-auth key for the adapter node
#   2. Create the authKeySecret Secret with key `authkey` containing it
#   3. Write a grant row into the `relay-access-grants` ConfigMap carrying the
#      operator-invented code as the row's identity, and hand that code to
#      the device out of band (see docs/relay.md).
#
# Entry schema:
#   kind:          app                       (required)
#   image:         string                    (default: tailscale/tailscale)
#   tag:           string                    (default: stable)
#   pullPolicy:    Always|IfNotPresent|Never (default: IfNotPresent)
#   loginServer:   string                    (required, e.g.
#                                              https://hs.example.com)
#   hostname:      string                    (default: relay; tailnet members
#                                              reach the relay at this
#                                              hostname via MagicDNS)
#   authKeySecret: string                    (default: relay-tsnet-authkey)
#
# Example:
#   channels:
#     app:
#       kind: app
#       loginServer: https://hs.example.com
#
# The shipped default renders no adapter and no relay port reachable from
# outside the namespace: pure dial-out, sealed.
channels: {}
