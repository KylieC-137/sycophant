{{- if eq .Values.render "inference" }}
{{- /*
One model's ConfigMap, `model-<name>`: the inference marker's flat data
verbatim. The harness watches the `sycophant.md/type: model` label set and keys
each model by its `app.kubernetes.io/name`, so a change takes effect on the next
turn without a restart.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-{{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sycophant.labels" . | nindent 4 }}
    sycophant.md/type: model
    app.kubernetes.io/name: {{ .Values.name | quote }}
data:
  {{- range $k, $v := .Values.marker }}
  {{ $k | quote }}: {{ $v | quote }}
  {{- end }}
{{- end }}
