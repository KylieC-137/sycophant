{{/* One `toolset-<name>` ConfigMap per toolset; the harness watches the label set. */}}
{{- range $name, $entry := .Values.toolsets }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: toolset-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/type: toolset
    app.kubernetes.io/name: {{ $name }}
data:
  toolset.yaml: |
    {{- dict $name $entry | toYaml | nindent 4 }}
{{- end }}
