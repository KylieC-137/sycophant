{{/*
Per-model egress policy for inference-job pods. One CiliumNetworkPolicy for a
remote model, selecting pods by the `sycophant.md/model` label the harness stamps
with the call's `model` value. A local model has no inference job: the harness
dials its Service directly.

Every remote model declares a `baseUrl`, and the single egress hole is derived
from that URL and from nothing else. Split on `://` for the scheme, take the
authority up to the first `/`, and split on `:` for host and port. An absent
port is 443 for https, 80 for http. One classification yields one of two peer
shapes, and each arm emits its rules and stops:

  fqdn      a dotted host -> an L7 kube-dns allowlist on :53 (matchName only)
            plus a `toFQDNs` rule on the parsed port.
  cidr      an IPv4 literal host -> a single `toCIDR <ip>/32` on the parsed
            port and NO :53 entry at all.

The command admission policy admits only a dotted or IPv4 host, so the policy
can never emit an unmatchable rule.

Cilium unions same-PortProtocol L7 DNS rules across every policy selecting the
same endpoint, so every :53 rule here MUST carry its own `rules.dns` block (never
an L4-only kube-dns rule) to avoid the L4-shadows-L7 hazard documented in
harness-cnp.yaml. An L4-only :53 rule here would unpin the L7 allowlist of any
sibling policy selecting the same pod. There is no `matchPattern` wildcard: that
would reopen DNS-tunnel exfil.

Egress is authored by the operator through the inference provision command and
applied from outside the tenant. The tenant does not author it.
*/}}
{{- if not (hasKey .Values.command "server.image") }}
{{- $key := .Values.name }}
{{- $baseUrl := .Values.command.baseUrl }}
{{- $scheme := first (splitList "://" $baseUrl) }}
{{- $hostPort := splitList ":" (first (splitList "/" (last (splitList "://" $baseUrl)))) }}
{{- $host := first $hostPort }}
{{- $port := ternary (last $hostPort) (ternary "443" "80" (eq $scheme "https")) (gt (len $hostPort) 1) }}
{{- $cidr := regexMatch `^[0-9]{1,3}(\.[0-9]{1,3}){3}$` $host }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: inf-{{ $key }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.labels" $ | nindent 4 }}
    sycophant.md/type: inference-egress
    sycophant.md/model: {{ $key | quote }}
spec:
  endpointSelector:
    matchLabels:
      sycophant.md/model: {{ $key | quote }}
      sycophant.md/job-kind: inference
      app.kubernetes.io/part-of: sycophant
  egress:
  {{- if not $cidr }}
    # DNS: resolve only this model's host. Co-scoped L7 so it unions with the
    # baseline's pinned matchName rule instead of shadowing it.
    {{- include "sycophant.dnsEgress" . | nindent 4 }}
          rules:
            dns:
              - matchName: {{ $host | quote }}
    - toFQDNs:
        - matchName: {{ $host | quote }}
      toPorts:
        - ports:
            - port: {{ $port | quote }}
              protocol: TCP
  {{- else }}
    # IP literal: pin the /32 on the parsed port. No DNS entry: the host is
    # already an address, so nothing here resolves a name.
    - toCIDR:
        - {{ printf "%s/32" $host | quote }}
      toPorts:
        - ports:
            - port: {{ $port | quote }}
              protocol: TCP
  {{- end }}
{{- end }}
