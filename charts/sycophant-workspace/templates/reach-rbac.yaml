{{/*
Per-workspace reach Role: get on exactly this workspace's harness Service,
by name, and nothing else. The user chart binds a subject's reach RoleBindings
to this Role, one per listed workspace, so a person's reach is the operator's
grant — and a workspace created after the grant binds nobody until the
operator re-grants. Each reach RoleBinding is owned by this Role, so deleting
the workspace garbage-collects every grant to it. No ConfigMap verb anywhere: a reach grant must never
carry the right to write commands.
*/}}
{{- $name := .Values.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ws-{{ $name }}-reach
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "sycophant.workspaceLabels" (dict "context" $ "name" $name) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
    resourceNames: ["ws-{{ $name }}"]
