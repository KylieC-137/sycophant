# Tenant values for the hello-world scenario.
#
# Copy this to the tenant config path, then `syco tenant up -f` (see README.md):
#
#   mkdir -p ~/.config/sycophant/tenants/tenant-hello-world
#   cp examples/scenarios/hello-world/values.yaml \
#     ~/.config/sycophant/tenants/tenant-hello-world/values.yaml
toolsets:
  stdlib:
    image: sycophant-registry:5000/toolset:latest
    keepalive: true
  ssh-credentials:
    image: sycophant-registry:5000/toolset-ssh-credentials:latest

workspaces:
  hello-world:
    # The model keys this workspace may name. Each is its own inference marker
    # (see README.md).
    models:
      - deepseek-v4-flash
    toolsets:
      - stdlib
      # A secret-only grant: the credential lands where ssh expects it and no
      # network hole opens, so the tool job stays on the baseline floor.
      - name: ssh-credentials
        grants:
          demo-key:
            secret: demo-ssh-key
            path: /home/agent/.ssh/id_ed25519
