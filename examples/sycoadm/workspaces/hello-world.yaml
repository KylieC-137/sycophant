# A workspace may name only models and toolsets already installed. demo-key is
# secret-only: the key lands where ssh expects it and no network hole opens.
workspace:
  name: hello-world
  tenant: e2e-test
  instructions: ../instructions/simple
  toolsets: [stdlib, workspace-ro, ssh-credentials]
  models: [local]
  grants:
    ssh-credentials:
      demo-key:
        secret: demo-ssh-key
        path: /home/agent/.ssh/id_ed25519
