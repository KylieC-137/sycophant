# Namespace tenant-e2e-test. Capacity is the memory quota, summed over pod
# limits: inference 2560Mi; relay, adapter, headscale, harness, workspace-init,
# and three toolset pods at 256Mi each (the LimitRange default where the chart
# sets none); install-wait 64Mi; and probe pods. About 5.1Gi, or 10.6Gi at the
# inference chart default of 8Gi, so 12Gi leaves headroom for either. It is set
# on first provision and not resized after.
tenant:
  name: e2e-test
  capacity: 12Gi

# In-cluster headscale on plain HTTP :8080. The operator reaches headscale by
# `sycoadm connect --tenant e2e-test` (port-forward + tailscale up); the app
# adapter joins it at the Service DNS name.
headscale:
  enabled: true
  serverUrl: http://localhost:8080
