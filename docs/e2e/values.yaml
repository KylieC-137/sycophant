# Images use the chart defaults (local builds, pullPolicy: Never) — no override
# needed here. Only the genuinely-different e2e settings remain below.

# Toolsets are chart values now, not CRs. e2e.sh overrides each `image` with the
# local-registry digest via --set-string, so only the shape lives here.
toolsets:
  stdlib:
    keepalive: true
  workspace-ro: {}
  # keepalive so the grant-bearing pod lingers for the e2e credential
  # assertions (exec into the live pod).
  ssh-credentials:
    keepalive: true

workspaces:
  hello-world:
    # Each model is its own inference marker (scripts/e2e.sh
    # write_inference_markers); the harness may name only these.
    models:
      - deepseek-v4-flash
      - local
    toolsets:
      - stdlib
      - workspace-ro
      # `demo-key` is secret-only: it delivers the key where ssh expects it and
      # opens no network hole, so no per-grant policy renders and a job holding
      # it stays on the fail-closed baseline floor. A policy selects only a pod
      # carrying its grant label, so it opens nothing until a call selects it.
      - name: ssh-credentials
        grants:
          demo-key:
            secret: demo-ssh-key
            path: /home/agent/.ssh/id_ed25519
